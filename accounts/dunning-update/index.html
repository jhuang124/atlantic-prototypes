<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix your payment</title>
<link rel="stylesheet" href="./demo-kit.css">
<style>
/* ==========================================================================
   Product layer for the dunning update page. Anatomy follows the accounts site
   (Figma Trials 18118:287311 payment, 18118:287325 confirmation, 9346:283968
   add payment method): header Home · wordmark · Sign in, warm paper page, white
   0-radius cards, filled graphite primary. The payment methods are one radio list
   (the wallets, then the card, open by default) with one action button that follows it.
   ========================================================================== */
:root { --primary: #2C2825; --primary-hover: #000; }
.public .stage.has-side { display: block; max-width: none; }
.public .stage.has-side > .demo-sidecard { position: fixed; top: 80px; right: 20px; width: 296px; z-index: 40; max-height: calc(100vh - 92px); overflow: auto; overscroll-behavior: contain; }
@media (max-width: 1239px) { .public .stage.has-side > .demo-sidecard { position: static; width: auto; max-width: 560px; margin: 152px auto 0; max-height: none; } }  /* 104 offsets .acct's bottom pull */

/* Shell: the whole accounts page, edge to edge. Phone = the same page at 375. */
.acct { margin: -64px calc(50% - 50vw) -104px; background: var(--page); }
@media (max-width: 767px) { .acct { margin-top: -32px; } }   /* the kit's .public top padding drops to 32 here */
.acct.is-phone { background: #E9E7E2; padding: 32px 0 0; }
.vp { container-type: inline-size; background: var(--page); min-height: 100vh; display: flex; flex-direction: column; }
.is-phone .vp { width: 375px; max-width: 100%; margin: 0 auto; border: 1px solid var(--hairline); border-bottom: 0; }
.acct-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 66px; padding: 0 32px;
  background: var(--surface); border-top: 4px solid #000; border-bottom: 1px solid var(--hairline); }
.acct-header a { font: 600 14px/16px var(--font-sans); color: #000; text-decoration: none; }
.acct-header .right { justify-self: end; }
.acct-header .wm { display: block; height: 30px; width: auto; }
.acct-body { flex: 1; padding: 40px 24px 104px; }
.col-checkout { max-width: 562px; margin: 0 auto; }
.col-utility { max-width: 520px; margin: 0 auto; }
.col-confirm { max-width: 594px; margin: 0 auto; }
.acct-body > .demo-box { max-width: 562px; margin: 48px auto 0; }

.acct-foot { position: relative; display: flex; justify-content: space-between; gap: 40px; padding: 48px 80px 56px;
  background: var(--page); border-top: 1px solid var(--hairline); }
.acct-foot nav { display: flex; flex-wrap: wrap; gap: 12px 32px; }
.acct-foot nav a { font: 14px/1.3 var(--font-sans); color: #000; text-decoration: none; }
.acct-foot .legal { display: flex; gap: 12px; margin-top: 28px; font: 12px/1.3 var(--font-sans); }
.acct-foot .legal a { color: #000; text-decoration: none; }
.acct-foot .legal span { width: 1px; background: var(--stone); }
.acct-foot .captcha { margin-top: 12px; font: 12px/1.5 var(--font-sans); color: #000; }
.foot-mark { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: none; }
.foot-mark .glyph { font: 600 64px/1 var(--font-serif); color: var(--ink-soft); }
.foot-mark img { height: 22px; width: auto; }
.help-pill { position: absolute; right: 20px; bottom: 20px; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px;
  border-radius: 48px; background: #000; color: #fff; font: 600 15px/1 var(--font-sans); text-decoration: none; }

/* Type */
.pg-title { font: 40px/1.1 var(--font-serif); color: #000; }
.pg-dek { margin-top: 12px; font: 18px/1.45 var(--font-sans); color: var(--ink-soft); }
.sec-title { margin: 40px 0 16px; font: 28px/1.15 var(--font-serif); color: #000; }

/* Cards: white, 1px hairline, square corners */
.box { background: var(--surface); border: 1px solid var(--hairline); border-radius: 0; padding: 24px; }
.summary { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
.fld dt { font: 12px/16px var(--font-sans); color: var(--ink-soft); }
.fld dd { margin: 4px 0 0; font: 18px/1.35 var(--font-sans); color: #000; }

/* Method list: one white card of radio rows (PayPal · Apple Pay · Google Pay · Card), the shape of
   Stripe's Payment Element accordion. The picked row opens: the card's fields, or one line on what
   happens next. Native radios, so arrow keys move the pick. */
.pm-list { margin: 0; padding: 0; min-width: 0; border: 1px solid var(--hairline); background: var(--surface); }
.pm-row + .pm-row { border-top: 1px solid var(--hairline); }
.pm-head { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 12px 16px; cursor: pointer; }
.pm-row:not(.is-on) .pm-head:hover { background: #FAF8F5; }
.pm-radio { appearance: none; -webkit-appearance: none; flex: none; display: grid; place-items: center; width: 20px; height: 20px; margin: 0;
  border: 1.5px solid var(--stone); border-radius: 50%; background: var(--surface); cursor: pointer; transition: border-color .15s; }
.pm-radio::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); transform: scale(0); transition: transform .15s cubic-bezier(.22,.61,.36,1); }
.pm-radio:checked { border-color: var(--primary); }
.pm-radio:checked::before { transform: scale(1); }
.pm-radio:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
.pm-tile { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 1px; width: 46px; height: 30px;
  border: 1px solid var(--hairline); border-radius: 4px; background: var(--surface); color: #000; font: 500 12px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.pm-tile svg { width: 13px; height: 13px; }
.pm-tile.is-card svg { width: 20px; height: 20px; }
.pm-tile.is-dark { background: #000; border-color: #000; color: #fff; }
.pm-tile .pp { font-size: 10px; }
.pm-name { flex: 1; min-width: 0; font: 16px/1.25 var(--font-sans); color: #000; }
.pm-row.is-on .pm-name { font-weight: 600; }
.pm-marks { display: flex; gap: 3px; transition: opacity .15s; }
.pm-marks svg { width: 24px; height: 16px; }
.pm-row.is-on .pm-marks { opacity: 0; }
/* Open and close: rows grow to fit (grid 0fr → 1fr); a closed body is hidden from tab and readers */
.pm-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s cubic-bezier(.22,.61,.36,1); }
.pm-row.is-on .pm-body { grid-template-rows: 1fr; }
.pm-body-in { min-height: 0; overflow: hidden; visibility: hidden; transition: visibility 0s .26s; }
.pm-row.is-on .pm-body-in { visibility: visible; transition-delay: 0s; }
.pm-pad { padding: 4px 16px 20px; }
.pm-note { padding: 0 16px 18px 48px; font: 14px/1.5 var(--font-sans); color: var(--ink-soft); }
/* The one action under the list follows the pick: the graphite primary for a card, the wallet's own button otherwise */
.pm-consent { margin-top: 16px; font: 13px/1.45 var(--font-sans); color: var(--stone); }
.pm-consent a { color: inherit; }
.pay-submit > [hidden] { display: none; }
.pay-submit .btn, .pay-submit .wallet { width: 100%; height: 48px; }
.pay-submit [data-swap] { animation: pmSwap .2s cubic-bezier(.22,.61,.36,1) both; }
@keyframes pmSwap { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.wallet { border: 0; border-radius: 4px; background: #000; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 4px; font: 500 20px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.wallet:hover { background: #222; }
.wallet:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.wallet svg { width: 18px; height: 18px; }
.wallet.is-paypal { background: #FFC439; }
.wallet.is-paypal:hover { background: #F2B534; }
.wallet.is-paypal .pp { font-size: 20px; }
@media (prefers-reduced-motion: reduce) { .pm-body, .pm-body-in, .pm-radio, .pm-radio::before, .pm-marks { transition: none; } .pay-submit [data-swap] { animation: none; } }

/* Card form: labeled fields (Arial 16 in 52px fields), brand badges */
.pay-fields { display: grid; gap: 16px; }
.pay-fields .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pay-field { display: flex; flex-direction: column; gap: 8px; position: relative; }
.pay-field label { font: 500 12px/16px var(--font-sans); color: var(--ink-soft); }
.pay-input { height: 52px; width: 100%; padding: 0 16px; border: 1px solid var(--stone); border-radius: 4px; background: var(--surface); color: var(--ink); font: 16px/1.3 Arial, sans-serif; }
.pay-input::placeholder { color: var(--stone); }
.pay-input:focus { outline: 2px solid var(--link); outline-offset: 0; }
.has-brands .pay-input { padding-right: 124px; }
.brands { position: absolute; right: 12px; bottom: 18px; display: flex; gap: 4px; pointer-events: none; }
.brands svg { display: block; transition: opacity .15s; }
.brands.picked svg:not(.on) { opacity: .25; }
.pay-submit { margin-top: 12px; }
.after-note { margin-top: 20px; font: 13px/1.5 var(--font-sans); color: var(--stone); text-align: center; }
.after-note a { color: var(--stone); }

/* Card-only page (recipe: one centered utility card) */
.util-title { font: 30px/1.15 var(--font-serif); color: #000; }
.util-body { margin-top: 12px; font: 16px/1.5 var(--font-sans); color: var(--ink-soft); }
.util-card form { margin-top: 24px; }
.util-meta { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--hairline); font: 14px/1.5 var(--font-sans); color: var(--stone); }

/* Confirmation (ConfirmationTemplate) */
.cf-title { font: 40px/1.2 var(--font-serif); color: #000; }
.cf-body { margin-top: 16px; font: 16px/1.5 var(--font-sans); color: var(--ink-soft); }
.cf-rule { margin: 32px 0; border: 0; border-top: 1px solid var(--stone); opacity: .5; }
.cf-sum { margin: 0; }
.cf-sum h2 { font: 28px/1.15 var(--font-serif); color: #000; margin-bottom: 20px; }
.cf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 0; }
.cf-grid dt { font: 500 12px/1.3 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: #000; }
.cf-grid dd { margin: 6px 0 0; font: 21px/1.3 var(--font-serif); color: var(--ink-soft); overflow-wrap: anywhere; }
.cf-care { font: 21px/1.45 var(--font-serif); color: var(--ink-soft); }
.cf-care a { color: inherit; }
.cf-actions { margin-top: 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px; }

/* Stub pages */
.stub-tag { display: inline-block; margin-top: 20px; }

/* Narrow: same page at phone width (container query, so the Phone view and a real phone agree) */
@container (max-width: 600px) {
  .acct-header { padding: 0 16px; }
  .acct-header .wm { height: 22px; }
  .acct-body { padding: 24px 0 72px; }
  .col-checkout > :not(.box):not(form), .col-confirm, .col-utility > :not(.box) { padding-left: 16px; padding-right: 16px; }
  .col-checkout form > :not(.box):not(.pm-list) { margin-left: 16px; margin-right: 16px; }
  .col-checkout .box, .col-checkout .pm-list, .col-utility .box { border-left: 0; border-right: 0; }
  .pg-title, .cf-title { font-size: 32px; }
  .pg-dek { font-size: 16px; }
  .summary, .cf-grid { grid-template-columns: 1fr; }
  .acct-foot { flex-direction: column-reverse; align-items: flex-start; gap: 28px; padding: 32px 16px 80px; }
  .acct-foot nav { flex-direction: column; gap: 14px; }
  .acct-body > .demo-box { margin: 40px 16px 0; }
}

/* Wallet sheets: system UI, not Atlantic. Drawn to read as the OS, not the product. */
.sheet-scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; z-index: 60; }
.sheet-scrim.center { align-items: center; }
.sheet { width: min(420px, 100%); background: #f2f2f7; border-radius: 14px 14px 0 0; padding: 14px 18px 26px; font: 15px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #000; }
.sheet.gpay { background: #fff; border-radius: 12px; padding: 22px 22px 18px; font-family: Roboto, 'Segoe UI', Arial, sans-serif; }
.sheet.paypal { background: #fff; border-radius: 12px; padding: 22px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 600; font-size: 17px; }
.sheet-head button { background: none; border: 0; color: #0a64d8; font: inherit; font-weight: 400; cursor: pointer; }
.sheet-card { background: #fff; border-radius: 10px; }
.sheet-line { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; }
.sheet-line + .sheet-line { border-top: .5px solid #d1d1d6; }
.sheet-line span:first-child { color: #6b6b70; }
.sheet-pay { margin-top: 16px; width: 100%; height: 50px; border: 0; border-radius: 10px; background: #000; color: #fff; font: 600 17px/1 inherit; cursor: pointer; }
.gpay .sheet-pay { background: #1a73e8; border-radius: 22px; height: 44px; font-size: 15px; }
.paypal .sheet-pay { background: #0070E0; border-radius: 22px; height: 44px; font-size: 15px; }
.sheet .alert { margin: 12px 0 0; }
.sheet-note { font-size: 12px; color: #6b6b70; text-align: center; margin: 10px 0 0; }
.pp { font: italic 700 19px/1 Verdana, 'Helvetica Neue', sans-serif; letter-spacing: -.02em; }
.pp b { color: #003087; font-weight: 700; } .pp i { color: #0070E0; }

/* Email (kit email frame, Atlantic template body) */
.wm-email { display: block; height: 20px; width: auto; margin: 0 0 28px; }
.benefits { margin: 0 0 8px; padding-left: 20px; } .benefits li { margin: 4px 0; }
/* ==========================================================================
   Today: replicas of the accounts site as it ships (SiteHeader, PageLayout,
   AccountsNav, Card, BillingInfo, AddCreditCardStripe, EmailLoginForm).
   Values from the SCSS: card 687, nav 174, Garamond titles 26→30, Goldwyn-style
   mono buttons 16/300, primary #2c2825, secondary blue on #f0f6ff.
   ========================================================================== */
.acct-header .left, .acct-header .right { min-width: 1px; }
.af-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; position: relative; padding: 12px 24px; border: 1px solid transparent; border-radius: 4px;
  background: #2c2825; color: #fff; font: 300 16px/19px var(--font-mono); cursor: pointer; text-decoration: none; white-space: nowrap; }
.af-btn:hover { background: #45423f; }
.af-btn.thick { padding: 16px 24px; }
.af-btn.block { width: 100%; }
.af-btn-sec { background: #f0f6ff; color: #166999; border-color: #166999; }
.af-btn-sec:hover { background: #10537a; border-color: #10537a; color: #fff; }
.af-btn-ter { background: none; border: 0; padding: 0 0 2px; color: #166999; font: 300 16px/19px var(--font-mono); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .3em; cursor: pointer; }
.af-saved { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 4px; background: #e0e6ed; color: #007358; font: 16px/1 var(--font-sans); }

/* Account page grid: nav rail 174 + card column 687 */
.af-page { display: grid; grid-template-columns: 1fr 687px 1fr; padding: 32px 0 50px; }
.af-nav { justify-self: start; width: 174px; padding-left: 48px; box-sizing: content-box; }
.af-nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 20px; }
.af-nav a { font: 16px/1.25 var(--font-sans); color: #4a4a4a; text-decoration: none; }
.af-nav a:hover { color: #000; }
.af-nav a[aria-current="page"] { color: #000; font-weight: 600; border-bottom: 2px solid #000; padding-bottom: 2px; }
.af-nav ul ul { margin: 20px 0 0 5px; padding-left: 15px; border-left: 1px solid #ebeae8; }
.af-nav ul ul a { font-size: 14px; }
.af-navbtn { display: none; }
.af-main { min-width: 0; }
.af-card { background: #fff; border: 1px solid #e7e3db; margin-bottom: 24px; position: relative; }
.af-int { padding: 24px; border-top: 1px solid #e7e3db; }
.af-title { margin: 0; font: 400 30px/34px var(--font-serif); color: #2c2825; }
.af-desc { margin: 12px 0 24px; font: 18px/24px var(--font-sans); color: #2c2825; }
.af-gray { font: 18px/24px var(--font-sans); color: #6f6c69; }
.af-benefits { list-style: none; margin: 0; padding: 0; }
.af-benefits li { display: flex; align-items: flex-start; padding-bottom: 8px; font: 14px/18px var(--font-sans); color: #2c2825; }
.af-benefits li:last-child { padding-bottom: 0; }
.af-benefits svg { flex: none; margin: 2px 12px 0 4px; }
.af-benefits em { font-style: italic; }
.af-action { position: absolute; top: 24px; right: 24px; }
.af-fields { display: flex; flex-wrap: wrap; }
.af-field { width: 50%; }
.af-fields.thirds .af-field { width: 33.333%; padding-bottom: 24px; }
.af-field dt { margin-bottom: 8px; font: 12px/1.2 var(--font-sans); color: #2c2825; }
.af-field dd { margin: 0; display: flex; align-items: center; font: 18px/1 var(--font-sans); color: #2c2825; }
.af-billhead { display: flex; justify-content: space-between; align-items: flex-end; column-gap: 12px; padding-bottom: 12px; }
.af-billhead + .af-fields { padding-top: 16px; }
.af-brand { height: 24px; min-width: 46px; margin-right: 8px; }
.af-addr { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.af-addr .af-card { height: 207px; margin: 0; }
.af-addr h3 { margin: 0 0 16px; font: 12px/1.2 var(--font-sans); color: #2c2825; }
.af-addr .af-gray { height: 120px; }
.af-addr .af-ter-pos { position: absolute; top: 24px; right: 24px; }
.af-note-small { margin: 8px 0 20px; font: 12px/16px var(--font-sans); color: #4a4a4a; letter-spacing: .17px; }

/* Stripe Payment Element, default theme (no appearance passed in AddCreditCardStripe.js) */
.spe { margin: 20px 0 24px; font: 14px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; color: #30313d; }
.spe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.spe-f { display: flex; flex-direction: column; gap: 4px; position: relative; }
.spe-f.full { grid-column: 1 / -1; }
.spe-f label { font-size: 14px; color: #30313d; }
.spe-in { height: 44px; padding: 0 12px; border: 1px solid #e6e6e6; border-radius: 5px; background: #fff; color: #30313d;
  box-shadow: 0 1px 1px rgba(0,0,0,.03), 0 3px 6px rgba(0,0,0,.02); font: 16px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; width: 100%; }
.spe-in:focus { outline: 0; border-color: hsla(210,96%,45%,50%); box-shadow: 0 0 0 3px hsla(210,96%,45%,25%); }
.spe-in::placeholder { color: #757680; }
.spe-f .brands { bottom: 13px; }
.spe-f.has-brands .spe-in { padding-right: 124px; }
.spe-legal { margin-top: 12px; font-size: 12px; color: #6d6e78; }
.af-btnrow { display: flex; flex-wrap: nowrap; align-items: center; gap: 24px; }
.af-btnrow .af-btn { flex: 0 0 50%; }
.af-scope .alert { order: 3; margin: 24px 0 0; padding: 0; border: 0; background: none; color: #dd1001; font: 16px/1.4 var(--font-sans); }
.af-scope { display: flex; flex-direction: column; }

/* Sign-in (EmailLoginCardLayout: 432 wide, on the page background, no card) */
.af-login { max-width: 432px; margin: 48px auto 0; padding: 0 28px 104px; box-sizing: content-box; }
.af-login .af-title { padding-bottom: 32px; }
.af-label { display: block; margin-bottom: 8px; font: 600 12px/12px var(--font-sans); letter-spacing: .5px; color: #2c2825; }
.af-inwrap { position: relative; }
.af-input { width: 100%; height: 52px; padding: 16px; border: 1px solid #6f6c69; border-radius: 4px; background: #fff; color: #2c2825; font: 16px/1.2 var(--font-sans); }
.af-input:disabled { background: #f8f7f4; color: #6f6c69; }
.af-input:focus { outline: 0; border: 2px solid #000; padding: 15px; }
.af-inline { position: absolute; top: 0; right: 0; padding: 18px; background: none; border: 0; font: 500 14px/16px var(--font-sans); color: #2c2825; cursor: pointer; }
.af-gap { height: 22px; }
.af-or { display: flex; align-items: center; margin: 24px 0 16px; font: 14px/15px var(--font-sans); letter-spacing: 1px; text-transform: uppercase; color: #2c2825; }
.af-or::before, .af-or::after { content: ''; flex: 1; border-top: 1px solid #e7e3db; }
.af-or span { padding: 0 16px; }
.af-social { display: grid; gap: 8px; }
.af-lb { position: relative; display: flex; align-items: center; width: 100%; padding: 12px 40px 12px 20px; border: 1px solid #6f6c69; border-radius: 4px; background: #e7e3db;
  color: #2c2825; font: 16px/16px var(--font-mono); text-align: left; cursor: pointer; text-decoration: none; }
.af-lb:hover { background: #48413d; color: #fff; }
.af-lb svg { position: absolute; left: 12px; width: 16px; height: 16px; }
.af-lb span { padding-left: 12px; }
.af-help { margin-top: 24px; font: 16px/24px var(--font-sans); color: #2c2825; }
.af-help a, .af-help button { color: #166999; text-decoration: underline; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
.af-back { display: inline-block; margin-bottom: 24px; font: 500 14px/16px var(--font-sans); color: #2c2825; text-decoration: none; }
.af-body { margin: -16px 0 24px; font: 16px/24px var(--font-sans); color: #2c2825; }
.af-body a { color: #166999; }

/* Narrow: SiteHeader logo 129x20, nav rail → "Subscription ⌄" bar, cards stack */
@container (max-width: 1079px) { .af-page { grid-template-columns: auto minmax(0, 1fr); gap: 48px; padding: 32px 48px 50px; } .af-nav { padding-left: 0; } }
@container (max-width: 767px) {
  .acct-header { border-top-width: 0; }

/* ==========================================================================

.acct.www .vp { background: #fff; }

/* The callout comes to the reader: a white sheet that rises from the bottom once they're into the
   story, or a beat after the page opens (the reactivation prototype's scroll sheet). It's sticky
   inside the article, so it docks to the bottom of the screen while they read and settles under the
   last paragraph at the end. The story fades into it (no scrim) and stays live and scrollable
   above it; nothing is trapped. Payment failed is the strong one; card expiring is a lighter heads-up. */
.w-dock { position: sticky; bottom: 0; z-index: 35; margin: 56px -24px 0; }
.w-pop-x, .w-pop-wm { display: none; }

.w-dock.is-pop .w-call::before, .w-dock.is-pop .w-call-kick, .w-dock.is-pop .w-call-foot { display: none; }
.w-dock.is-pop .w-pop-wm { display: block; height: 30px; width: auto; margin: 0 auto 24px; }
.w-dock.is-pop .w-pop-x { display: block; position: absolute; top: 16px; right: 16px; width: 24px; height: 24px; border: 0; border-radius: 50%; background: #2c2825; cursor: pointer; }
.w-dock.is-pop .w-pop-x::before, .w-dock.is-pop .w-pop-x::after { content: ''; position: absolute; left: 6px; right: 6px; top: 11px; height: 2px; background: #fff; transform: rotate(45deg); }
.w-dock.is-pop .w-pop-x::after { transform: rotate(-45deg); }

.w-dock.is-pop .w-call-body { margin: 0 auto 24px; font-size: 19px; }
.w-dock.is-pop .w-call-acts { flex-direction: column; gap: 14px; }
.w-dock.is-pop .w-call-btn { width: 100%; font-family: var(--font-sans); }
.w-dock.is-pop[data-state="in"] .w-call { animation: wPopIn .22s cubic-bezier(.22,.61,.36,1) both; }
.w-dock.is-pop[data-state="out"] { animation: wFade .2s reverse both; }
@keyframes wPopIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.acct.is-phone .w-dock.is-pop .w-call { padding: 36px 24px 24px; }
.w-dock[data-state="waiting"] { visibility: hidden; }
.w-call { position: relative; padding: 24px 28px 20px; background: #fff; border-top: 1px solid #e7e3db;
  box-shadow: 0 -1px 4px rgb(33 39 44 / .05), 0 -12px 28px rgb(33 39 44 / .07); }
.w-call:focus { outline: none; }
.w-call::before { content: ''; position: absolute; left: 0; right: 0; bottom: 100%; height: 72px; pointer-events: none;
  background: linear-gradient(to bottom, rgb(255 255 255 / 0), rgb(255 255 255 / .3) 58%, rgb(255 255 255 / .88) 90%, #fff); }
.w-call-in { max-width: 660px; margin: 0 auto; }
.w-dock[data-state="in"] .w-call { animation: wSheetUp .36s cubic-bezier(.22,.61,.36,1) both; }
.w-dock[data-state="in"] .w-call::before { animation: wFade .24s cubic-bezier(.22,.61,.36,1) both; }
.w-dock[data-state="out"] .w-call { animation: wSheetDown .22s cubic-bezier(.55,.06,.68,.19) both; }
@keyframes wSheetUp { from { opacity: .6; transform: translate3d(0, 100%, 0); } to { opacity: 1; transform: none; } }
@keyframes wSheetDown { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate3d(0, 100%, 0); } }
@keyframes wFade { from { opacity: 0; } to { opacity: 1; } }
.w-call-kick { margin: 0 0 10px; font: 500 11px/1.3 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: #6f6c69; }

.w-call-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.w-call-btn { min-height: 48px; padding: 12px 24px; border: 1px solid #000; border-radius: 4px; background: #000; color: #fff; font: 500 16px/1.1 var(--font-mono); cursor: pointer; }
.w-call-btn:hover { background: #2c2825; border-color: #2c2825; }
.w-call-btn:focus-visible, .w-call-later:focus-visible { outline: 2px solid #166999; outline-offset: 2px; }

<script>
/* ==========================================================================
   Dunning: fix your payment without signing in.
   A renewal charge failed. The dunning email's button opens a single-purpose
   page on accounts.theatlantic.com that charges the open invoice. Two layouts,
   switched from the Scene panel (the side card): All methods (one radio list:
   PayPal, Apple Pay, Google Pay, then Card, open by default; one button that
   follows the pick) or Card only (one clean card, the hosted-update-page
   pattern). "What happened" and "Starts from" pick the entry point: the email or
   an article callout, for a failed payment or for a card that expires before the
   renewal (pre-dunning: nothing failed, nothing owed, the page just saves a card).
   Version (Scene panel, every screen) flips between today and proposed.
   Presenter layer: the Scene panel sets up the screen beside it; the "Tours &
   screens" pill opens guided tours, Jump to a screen and Reset. One home each.
   Visual only: nothing is charged and no payment provider is called.
   Order: constants → scenarios → axes → derive → actions → paths → pages → init.
   ========================================================================== */

/* --- 1. Constants ------------------------------------------------------------ */
const TODAY = '2026-10-20';           // the anchor: day 7 of dunning
const FAILED_ON = '2026-10-13';       // day 0: the renewal charge failed
const CANCEL_ON = '2026-11-12';       // day 30: the subscription is canceled
const RENEWS_NEXT = '2027-10-13';     // a year from the original renewal date
const PRICE = 89.99;
// Card expiring (pre-dunning), on the same frozen today: the Visa on file runs out at the end of
// November, and the renewal falls after it, so it would fail if nothing changes.
const XP_CARD = '11/2026';             // as the accounts site prints it
const XP_CARD_END = 'the end of November';
const XP_SENT = '2026-10-20';          // the card-expiring email and the callout: today
const XP_RENEWS = '2026-12-04';        // the renewal the expiring card would miss
const XP_TERM_START = '2025-12-04';
const HELP ='Questions? Visit our Help Center or call (855) 940-0585.';
const STD_DAYS = [2, 5, 7, 15, 20, 25, 29];
const STD_SUBJECTS = ['Did your billing info change?', 'Issue With Your Subscription To The Atlantic', 'Don’t lose your access to The Atlantic',
  'Your subscription will be cancelled soon', 'Action Required - Your Atlantic subscription payment has failed', 'Your Atlantic subscription is ending',
  'Your subscription—and what it means to us'];
const GIFT_DAYS = [2, 5, 7, 15, 20, 25];
const GIFT_SUBJECTS = ['Did your billing info change?', 'Issue With Your Gift Subscription To The Atlantic', 'So they can keep enjoying unlimited access, please act now',
  'Your gift subscription will be cancelled soon', 'Action Required - Your gift subscription payment has failed', 'Your Atlantic gift subscription is ending'];

const DAY_MS = 864e5;
const at = (d) => new Date(DemoKit.iso(d) + 'T00:00:00Z');
const diff = (a, b) => Math.round((at(b) - at(a)) / DAY_MS);
// Dates as written, per the accounts voice rules: “November 12, 2026”
const F = (d, style) => style === 'short' ? DemoKit.fmt(d, 'short') : at(d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
const esc = DemoKit.esc;
const money = (n) => '$' + n.toFixed(2);
const APPLE = '<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true" style="margin-top:-3px"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>';
const GLOGO = '<svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
const PAYPAL = '<span class="pp"><b>Pay</b><i>Pal</i></span>';
const CARD_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="M2.5 9.5h19"/></svg>';
const CHAT_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg>';
// Card brand badges, drawn small like Stripe's. The one that matches the typed number stays lit.
const BRANDS = [
  ['Visa', '<rect width="30" height="20" rx="2" fill="#1A1F71"/><text x="15" y="13.5" text-anchor="middle" font-family="Arial" font-weight="700" font-style="italic" font-size="8.5" fill="#fff">VISA</text>'],
  ['Mastercard', '<rect width="30" height="20" rx="2" fill="#252525"/><circle cx="12" cy="10" r="5.5" fill="#EB001B"/><circle cx="18" cy="10" r="5.5" fill="#F79E1B" fill-opacity=".9"/>'],
  ['Amex', '<rect width="30" height="20" rx="2" fill="#2E77BC"/><text x="15" y="13" text-anchor="middle" font-family="Arial" font-weight="700" font-size="7" fill="#fff">AMEX</text>'],
  ['Discover', '<rect x=".5" y=".5" width="29" height="19" rx="2" fill="#fff" stroke="#D9D9D9"/><text x="12" y="12.5" text-anchor="middle" font-family="Arial" font-weight="700" font-size="5.5" fill="#231F20">DISCOVER</text><circle cx="25" cy="10" r="2.6" fill="#F48120"/>'],
].map(([b, inner]) => `<svg data-b="${b}" viewBox="0 0 30 20" width="30" height="20" aria-hidden="true">${inner}</svg>`).join('');
// Each wallet: its row in the method list (tile + note on what happens next), its branded action
// button, and the sheet that button opens. Notes take the kind: payment failed or card expiring.
const WALLETS = {
  paypal: { label: 'PayPal', button: PAYPAL, tile: PAYPAL, card: 'jane.m•••@example.com', sheet: 'paypal',

/* --- 4. Derive: everything dated comes from the clock ------------------------ */
function derive(s, today) {
  const t = DemoKit.iso(today);
  const day = diff(FAILED_ON, t);
  const paid = s.sub.status === 'active';
  const ended = !paid && t >= CANCEL_ON;
  const daysLeft = diff(t, CANCEL_ON);
  const gift = s.gift;
  const days = gift ? GIFT_DAYS : STD_DAYS, subjects = gift ? GIFT_SUBJECTS : STD_SUBJECTS;
  let emailNo = 0;
  days.forEach((d, i) => { if (d <= day) emailNo = i + 1; });
  emailNo = Math.max(1, emailNo);
  const emailSentOn = DemoKit.iso(new Date(at(FAILED_ON).getTime() + days[emailNo - 1] * DAY_MS));
  const o = s.old;
  const oldLabel = o.type === 'paypal' ? 'PayPal' : `${o.brand} ending ${o.last4}`;
  const reason = o.reason === 'expired' ? `your ${oldLabel} has expired` : o.reason === 'insufficient_funds' ? `your bank declined the ${oldLabel}` : 'your PayPal billing agreement was canceled';
  const short = gift
    ? `We couldn’t renew ${gift.first}’s gift because ${reason}.`
    : `We couldn’t renew your subscription because ${reason}.`;
  // No date or countdown: the length of the grace period isn't confirmed, so the copy never states one
  const until = gift ? `Update it to keep ${gift.first}’s access.` : 'Update it to keep your access.';
  const methodText = (m) => m ? (m.type === 'card' ? `${m.brand} ending ${m.last4}` : `${WALLETS[m.type].label} (${m.card})`) : oldLabel;
  return { short, until, day, paid, ended, daysLeft, emailNo, emailSentOn, subject: subjects[emailNo - 1], oldLabel, methodText,
    status: paid ? 'active' : ended ? 'cancelled' : 'past_due',
    headline: gift ? `So ${gift.first} can keep enjoying The Atlantic` : 'Don’t miss a story' };
}

/* Card-expiring email (pre-dunning). No live send was captured, so this is written in the dunning
   emails' voice, with the headline, button and legal line from the earlier card-expiration
   prototype ("Your payment method is expiring.", "Update Payment Method"). One button. */
function expiringEmail(el, s) {
  const g = s.gift, today = expOf() === 'today';

    </div></article></div>

/* The update page (public, link-entry). Steps: pay (default) → done. Spent and ended are derived. */
// A plain message in one utility card: the spent link and the canceled subscription
const notice = (title, body, cta, href) => shell(`<div class="col-utility"><div class="box util-card">
  <h1 class="util-title">${title}</h1><p class="util-body">${body}</p>
  <div class="pay-submit"><a class="btn" href="${href}">${cta}</a></div></div></div>`);
// Where "back" goes: the story they were reading, or the site
const backTo = () => fromArticle() ? ['Return to Your Article', `#/article?${qs()}`] : ['Back to TheAtlantic.com', '#/reading'];
const cardFields = () => `<div class="pay-fields">
    <div class="pay-field has-brands"><label for="cc">Card number</label>
      <input class="pay-input" id="cc" inputmode="numeric" autocomplete="cc-number" placeholder="1234 1234 1234 1234">

    </div>

      <div class="pay-field"><label for="country">Country</label><select class="pay-input" id="country" autocomplete="country-name"><option>United States</option><option>Canada</option><option>United Kingdom</option></select></div>

/* All methods: one list, one button. PayPal, Apple Pay, Google Pay, then Card, which is picked and open
   by default, its fields in the last row right above the button. Picking a wallet folds the
   card away, shows one line on what happens next, and swaps the button for that wallet's own.
   The pick survives re-renders of the same visit (Scene panel changes) and resets on a fresh one. */
const METHODS = ['paypal', 'apple_pay', 'google_pay', 'card'];
let payPick = { method: 'card', state: null };
function pickedMethod() {
  if (!document.querySelector('.pm-list') || payPick.state !== kit.state) payPick.method = 'card';
  payPick.state = kit.state;
  return payPick.method;
}
// The fine print, one short line by the button. It follows the pick.
const PAYS_WITH = { card: 'this card', paypal: 'PayPal', apple_pay: 'Apple Pay', google_pay: 'Google Pay' };
const consentLine = (m, kind) => kind === 'expiring'
  ? `Nothing is due today. We’ll charge ${PAYS_WITH[m]} from ${F(XP_RENEWS)}, under our <a href="#/help">terms</a>.`
  : `We’ll charge ${PAYS_WITH[m]} ${money(PRICE)} today and at each renewal, under our <a href="#/help">terms</a>.`;
const helpNote = '<p class="after-note">No sign-in needed, and we’ll never ask for your password. Questions? <a href="#/help">Visit our Help Center</a> or call (855) 940-0585.</p>';
function methodList(kind, pick) {
  const xp = kind === 'expiring';
  const row = (m) => {
    const on = m === pick, W = WALLETS[m];
    const tile = m === 'card' ? `<span class="pm-tile is-card" aria-hidden="true">${CARD_ICON}</span>`
      : `<span class="pm-tile${W.dark ? ' is-dark' : ''}" aria-hidden="true">${W.tile}</span>`;
    const body = m === 'card' ? `<div class="pm-pad">${cardFields()}</div>` : `<p class="pm-note">${W.note(xp)}</p>`;
    return `<div class="pm-row${on ? ' is-on' : ''}" data-pm="${m}">
      <label class="pm-head"><input class="pm-radio" type="radio" name="pm" value="${m}"${on ? ' checked' : ''}>${tile}
        <span class="pm-name">${m === 'card' ? 'Card' : W.label}</span>${m === 'card' ? `<span class="pm-marks" aria-hidden="true">${BRANDS}</span>` : ''}</label>
      <div class="pm-body"><div class="pm-body-in">${body}</div></div></div>`;
  };
  return `<fieldset class="pm-list"><legend class="sr-only">Payment method</legend>${METHODS.map(row).join('')}</fieldset>`;
}
// The action button for each method; only the picked one shows. Card submits the form.
function methodActions(kind, pick, cardLabel) {
  const verb = kind === 'expiring' ? 'Continue with' : 'Pay with';
  return `<div class="actions pay-submit"><button class="btn" type="submit" data-pay="card"${pick === 'card' ? '' : ' hidden'}>${cardLabel}</button>${
    Object.keys(WALLETS).map((w) => `<button class="wallet${w === 'paypal' ? ' is-paypal' : ''}" type="button" data-pay="${w}" data-wallet="${w}" aria-label="${verb} ${WALLETS[w].label}"${pick === w ? '' : ' hidden'}>${WALLETS[w].button}</button>`).join('')}</div>`;
}
function methodPicker(el, kind) {
  const f = el.querySelector('#card');
  f.querySelectorAll('[data-wallet]').forEach((b) => b.addEventListener('click', () => walletSheet(b.dataset.wallet, kind)));
  f.querySelector('.pm-list').addEventListener('change', (e) => {
    if (e.target.name !== 'pm') return;
    const m = payPick.method = e.target.value;
    f.querySelectorAll('.pm-row').forEach((r) => r.classList.toggle('is-on', r.dataset.pm === m));
    f.querySelectorAll('[data-pay]').forEach((b) => { b.hidden = b.dataset.pay !== m; b.toggleAttribute('data-swap', b.dataset.pay === m); });
    f.querySelector('[data-consent]').innerHTML = consentLine(m, kind);
    f.querySelectorAll('[data-dk-fail]').forEach((n) => n.remove());   // a card decline doesn't belong to the new pick
  });
}

function updatePage(el, ctx) {
  if (syncControls()) return;
  const { state: s, derived: d } = ctx;
  const step = kit.param('step') || 'pay';
  const g = s.gift;
  // Today has no such page. Its counterpart for the same moment: the Subscription page once the card
  // is in, or else where today's email button lands (Subscription when signed in, sign-in when not).
  if (expOf() === 'today') {
    const after = step === 'done' && savedNow(s, d);
    later(() => kit.navigate(after || s.session === 'in' ? `#/subscription?${qs()}` : `#/login?${qs({ step: 'email' })}`,
      { session: after ? 'in' : undefined, push: false }));
    return;
  }
  if (kindOf() === 'expiring') return expiringUpdate(el, s, step);
  const [backLabel, backHref] = backTo();

  if (step === 'done' && d.paid) {
    const m = s.sub.method;
    const rows = [['Subscription plan', g ? `Atlantic Digital gift for ${esc(g.name)}` : 'Atlantic Digital'], ['Email', esc(s.subscriber.email)],
      ['Next billing date', F(RENEWS_NEXT)], ['Paid with', esc(d.methodText(m))], ['You paid', money(PRICE)]];
    el.innerHTML = shell(`<div class="col-confirm">
      <h1 class="cf-title">Thank you, ${esc(s.subscriber.first)}.</h1>
      <p class="cf-body">${g
        ? `${esc(g.first)}’s gift subscription is renewed through ${F(RENEWS_NEXT)}, and a receipt is on its way to you. Thank you for sharing <i>The Atlantic</i>, and for supporting independent journalism.`
        : `Your subscription is renewed through ${F(RENEWS_NEXT)}, and a receipt is on its way to you. Thank you for supporting our journalism.`}</p>
      <hr class="cf-rule">
      <section class="cf-sum" aria-labelledby="sum-h"><h2 id="sum-h">Order Summary</h2>
        <dl class="cf-grid">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl></section>
      <hr class="cf-rule">
      <p class="cf-care">Something not right? <a href="#/help">Contact Customer Care</a>.</p>
      <div class="cf-actions"><a class="btn" href="${backHref}">${backLabel}</a><a class="link" href="#/subscription?${qs({ exp: 'today' })}" data-dk-session="in">See Your Account</a></div>
    </div>`, kit.next(fromArticle()
        ? { text: 'Back on the article, the callout is gone: there’s nothing left to fix.',
          links: [{ label: 'Back to the article >', to: `#/article?${keep()}` }, { label: 'See it in the account >', to: '#/subscription?' + qs({ exp: 'today' }), session: 'in' }] }
        : { text: 'The email link is spent now: opening it again shows the payment is up to date.',
          links: [{ label: 'Open the email again >', to: `#/email?${keep()}` }, { label: 'See it in the account >', to: '#/subscription?' + qs({ exp: 'today' }), session: 'in' }] }));
    return;
  }
  if (d.paid) {
    el.innerHTML = notice('You’re all set', `We received your ${money(PRICE)} payment on ${F(s.sub.paidOn)}, and ${g ? `${esc(g.first)}’s gift subscription` : 'your subscription'} is renewed through ${F(RENEWS_NEXT)}. Thank you for supporting our work.`,
      backLabel, backHref);
    return;
  }
  if (d.ended) {
    el.innerHTML = notice(`Your ${g ? 'gift ' : ''}subscription has been canceled`,
      `We weren’t able to process payment, so ${g ? `the gift subscription for ${esc(g.name)}` : 'your subscription'} was canceled. Nothing is owed. Thank you for your time ${g ? 'sharing The Atlantic' : 'as a subscriber'} and for your support. We hope to welcome you back.`,
      g ? 'Give a New Gift' : 'Resubscribe', '#/restart');
    return;
  }

  const cta = `Renew for ${money(PRICE)}`;

  if (layoutOf() === 'card') {
    // Card only: one centered utility card. Title, the reason, the card form, one button.
    el.innerHTML = shell(`<div class="col-utility"><div class="box util-card">
      <h1 class="util-title">Update your card</h1>
      <p class="util-body">${d.short} ${d.until}</p>
      <form id="card" novalidate>${cardFields()}<p class="pm-consent">${consentLine('card')}</p>${methodActions('failed', 'card', cta)}</form>
      <p class="util-meta">${g ? `Atlantic Digital gift for ${esc(g.name)}` : 'Atlantic Digital'}, ${money(PRICE)}/year. Renews ${F(RENEWS_NEXT)}.</p>
    </div>${helpNote}</div>`);
  } else {
    // All methods: what happened and what's at stake, then one list of methods, then one button.
    const pick = pickedMethod();
    const fields = [['Subscription', g ? 'Atlantic Digital gift' : 'Atlantic Digital'], g ? ['Gift for', esc(g.name)] : ['Subscriber since', String(s.subscriber.since)],
      ['Amount due', money(PRICE)]];
    el.innerHTML = shell(`<div class="col-checkout">
      <h1 class="pg-title">${esc(d.headline)}</h1>
      <p class="pg-dek">${d.short}</p>
      <dl class="box summary">${fields.map(([k, v]) => `<div class="fld"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
      <h2 class="sec-title">Payment Information</h2>
      <form id="card" novalidate>${methodList('failed', pick)}
        <p class="pm-consent" data-consent>${consentLine(pick)}</p>${methodActions('failed', pick, cta)}</form>
      ${helpNote}</div>`);
    methodPicker(el, 'failed');
  }
  cardForm(el);
}

/* The update page for a card that's about to expire (pre-dunning). Nothing is due, so nothing is
   charged: the page saves a payment method for the renewal and says the date stands. */
function expiringUpdate(el, s, step) {

/* Mock card fields: formatting and brand detection only */
function cardForm(el, kind) {
  // Visual only: no validation and no Stripe. Typing is optional; "Renew" (or "Save Card") always goes through.
  // Show a decline with Scene panel → "Show a payment error".
  const f = el.querySelector('#card');
  const cc = f.querySelector('#cc'), exp = f.querySelector('#exp'), cvc = f.querySelector('#cvc');
  const digits = (v) => v.replace(/\D/g, '');
  const brandOf = (n) => /^3[47]/.test(n) ? 'Amex' : /^5[1-5]|^2[2-7]/.test(n) ? 'Mastercard' : /^4/.test(n) ? 'Visa' : /^6/.test(n) ? 'Discover' : null;
  const badges = f.querySelector('.brands');
  cc.addEventListener('input', () => {
    const n = digits(cc.value).slice(0, 16);
    cc.value = n.replace(/(\d{4})(?=\d)/g, '$1 ');
    const b = brandOf(n);
    badges.classList.toggle('picked', !!b);
    badges.querySelectorAll('svg').forEach((c) => c.classList.toggle('on', c.dataset.b === b));
  });
  exp.addEventListener('input', () => { const n = digits(exp.value).slice(0, 4); exp.value = n.length > 2 ? n.slice(0, 2) + ' / ' + n.slice(2) : n; });
  cvc.addEventListener('input', () => { cvc.value = digits(cvc.value).slice(0, 4); });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    // Enter on a wallet row submits too: that opens the wallet, the same as its button
    const picked = f.querySelector('.pm-radio:checked');
    if (picked && picked.value !== 'card') { walletSheet(picked.value, kind); return; }
    const n = digits(cc.value);
    const method = { type: 'card', brand: (n.length >= 4 && brandOf(n)) || 'Visa', last4: n.length >= 4 ? n.slice(-4) : '4242' };
    const ok = kind === 'expiring'
      ? await kit.run(() => kit.act('save', method), 'Your card was declined, and nothing was saved. Please try another card or payment method.',
        { label: 'save a card', trigger: e.submitter })
      : await kit.run(() => kit.act('pay', method), 'Your card was declined, and nothing was charged. Please try another card or payment method.',
        { label: 'pay by card', trigger: e.submitter });
    if (ok) kit.setParam('step', 'done', { push: true });
  });
}
/* Wallet sheets: drawn as the OS would show them; the confirm runs through the error arm */
function overlay(cls, html, center) {
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim' + (center ? ' center' : '');
  scrim.innerHTML = `<div class="sheet ${cls}" role="dialog" aria-modal="true" data-dk-scope>${html}</div>`;
  document.body.appendChild(scrim);
  const opener = document.activeElement;   // focus goes back to the button that opened it
  const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); if (opener && opener.isConnected) opener.focus(); };
  scrim.addEventListener('click', (e) => { if (e.target === scrim || e.target.closest('[data-close]')) close(); });
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  setTimeout(() => { const b = scrim.querySelector('.sheet-pay'); if (b) b.focus(); });
  return { scrim, close };
}
function walletSheet(w, kind) {
  const W = WALLETS[w], amt = money(PRICE), xp = kind === 'expiring';

  const html = W.sheet === 'apple'
    ? `<div class="sheet-head"><span>${APPLE}Pay</span><button type="button" data-close>Cancel</button></div>${lines}
       <div class="actions"><button type="button" class="sheet-pay">${xp ? 'Confirm' : 'Pay'} with Face ID</button></div><p class="sheet-note">Double-click the side button in real life.</p>`
    : W.sheet === 'paypal'

         <div class="actions"><button type="button" class="sheet-pay">Pay ${amt}</button></div>`;
  const { scrim, close } = overlay(W.sheet === 'apple' ? '' : W.sheet, html, W.sheet !== 'apple');
  scrim.querySelector('.sheet-pay').addEventListener('click', async (e) => {
    const ok = xp

        { label: 'pay with a wallet', trigger: e.currentTarget, delay: 900 });
    if (ok) { close(); kit.setParam('step', 'done', { push: true }); }
  });
}

let calloutRise = 'wait';   // 'wait' | 'now' | 'shown'
let calloutState = null;
function riseCallout(el) {
  const dock = el.querySelector('.w-dock');
  if (!dock) return;
  if (calloutRise === 'shown') { dock.dataset.state = 'shown'; return; }
  const into = () => window.scrollY > 160;
  const rise = () => {
    window.removeEventListener('scroll', onScroll);
    if (!dock.isConnected || dock.dataset.state !== 'waiting') return;
    dock.dataset.state = 'in';
    calloutRise = 'shown';
  };
  const onScroll = () => { if (into()) rise(); };
  setTimeout(() => {   // after the render settles: a new screen has scrolled back to the top by then
    if (calloutRise === 'now' || into()) { rise(); return; }
    window.addEventListener('scroll', onScroll, { passive: true });
    setTimeout(rise, 1200);
  });
}

function dismissCallout(el) {
  const dock = el.querySelector('.w-dock');

  const done = () => {
    calloutDismissed = true;

    if (art) { art.tabIndex = -1; art.focus({ preventScroll: true }); }

  dock.dataset.state = 'out';
  setTimeout(done, 200);
}

          <a class="af-btn af-action" href="#/restart">Explore Options</a><div style="height:24px"></div></div></div>`
      : `<div class="af-card"><div class="af-int"><h2 class="af-title">Subscription Details</h2>
          <p class="af-desc">As a Digital subscriber, you enjoy:</p>
          <ul class="af-benefits">${['Unlimited access on any device', `12 magazine issues in PDF<em>&nbsp;(your last issue will be ${lastIssue})</em>`, '<em>The Atlantic</em>&nbsp;app for iOS and Android',
            'Narrated stories and podcasts', 'A digital archive, from 1857 to today', 'Gift articles to share with other readers', 'Subscriber events and discounts'].map((b) => `<li>${CHECK}<span>${b}</span></li>`).join('')}</ul>
          <a class="af-btn af-action" href="#/help">Manage</a></div>
        <div class="af-int"><dl class="af-fields"><div class="af-field"><dt>Subscription Period</dt><dd>${xp ? `${short(XP_TERM_START)}—${short(XP_RENEWS)}` : `${short(FAILED_ON)}—${short(RENEWS_NEXT)}`}</dd></div>
          <div class="af-field"><dt>Renewal Rate</dt><dd>${money(PRICE)}/year</dd></div></dl></div></div>`;
  // Billing Information, or the add-card form in its place

  const shownExp = card ? (card.exp || '12/2029') : xp ? XP_CARD : '09/2026';
  const nextBill = xp ? XP_RENEWS : d.paid ? RENEWS_NEXT : FAILED_ON;
  const billing = ended ? '' : adding

        <form id="af-add" class="af-scope" novalidate>

            <div class="spe-f"><label for="s-exp">Expiration date</label><input class="spe-in" id="s-exp" inputmode="numeric" placeholder="MM / YY"></div>
            <div class="spe-f"><label for="s-cvc">Security code</label><input class="spe-in" id="s-cvc" inputmode="numeric" placeholder="CVC"></div>

    : `<div class="af-card"><div class="af-int">
        <div class="af-billhead"><h2 class="af-title">Billing Information</h2><button class="af-btn af-btn-sec" type="button" data-add><span aria-hidden="true">+ </span>Add a New Payment Method</button></div>

          <div class="af-field"><dt>Payment Method</dt><dd>${brandLogo(shownBrand)}Ending in ${esc(shownLast4)}</dd></div>

          <div class="af-field"><dt>Next Billing Date</dt><dd>${short(nextBill)}</dd></div></dl></div></div>`;
  const addr = (title, lines) => `<div class="af-card"><div class="af-int"><h3>${title}</h3><button class="af-btn-ter af-ter-pos" type="button">Edit</button>
      <div class="af-gray">${lines.map(esc).join('<br>')}</div></div></div>`;
  const addresses = `<div class="af-addr">${addr('Mailing Address', [s.subscriber.name, '1200 Pine St, Apt 4B', 'Portland, OR 97205'])}${addr('Billing Address', ['1200 Pine St', 'Apt 4B', 'Portland, OR 97205'])}</div>`;
  const giftInferred = g ? 'Gift giver view is inferred: Jane has no subscription of her own, so the page offers her one, and Billing Information appears because she has gifts. ' : '';

  validate: (s) => s && s.sub && typeof s.sub.status === 'string' && s.old && s.subscriber,

});

/* Desktop means desktop: in a narrow window (or the app's browser pane) the Desktop view keeps its
   1280px layout and scales down to fit, instead of reflowing to the phone layout. Phone is unaffected. */
const DESK_W = 1280;
function fitDesktop() {
  document.querySelectorAll('.acct:not(.is-phone) > .vp').forEach((v) => {
    const w = v.parentElement.clientWidth;
    if (w && w < DESK_W) { v.style.width = DESK_W + 'px'; v.style.zoom = (w / DESK_W).toFixed(4); }
    else { v.style.width = ''; v.style.zoom = ''; }
  });
}
new MutationObserver(fitDesktop).observe(document.getElementById('app'), { childList: true, subtree: true });
addEventListener('resize', fitDesktop);
fitDesktop();
