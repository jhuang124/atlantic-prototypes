/* ==========================================================================

/* Type */

<div id="app"></div>
<script src="./demo-kit.js"></script>
<script>
/* ==========================================================================
   Dunning: fix your payment without signing in.
   A renewal charge failed. The dunning email's button opens a single-purpose
   page on accounts.theatlantic.com that charges the open invoice. Two layouts,
   switched from the side card: All methods (PayPal, Apple Pay, Google Pay, then
   a card) or Card only (one clean card, the hosted-update-page pattern).
   Visual only: nothing is charged and no payment provider is called.
   Order: constants → scenarios → axes → derive → actions → paths → pages → init.
   ========================================================================== */

/* --- 1. Constants ------------------------------------------------------------ */
const TODAY = '2026-10-20';           // the anchor: day 7 of dunning
const FAILED_ON = '2026-10-13';       // day 0: the renewal charge failed
const CANCEL_ON = '2026-11-12';       // day 30: the subscription is canceled
const RENEWS_NEXT = '2027-10-13';     // a year from the original renewal date
const PRICE = 89.99;
const HELP = 'Questions? Visit our Help Center or call (855) 940-0585.';
const STD_DAYS = [2, 5, 7, 15, 20, 25, 29];
const STD_SUBJECTS = ['Did your billing info change?', 'Issue With Your Subscription To The Atlantic', 'Don’t lose your access to The Atlantic',
  'Your subscription will be cancelled soon', 'Action Required - Your Atlantic subscription payment has failed', 'Your Atlantic subscription is ending',
  'Your subscription—and what it means to us'];
const GIFT_DAYS = [2, 5, 7, 15, 20, 25];
const GIFT_SUBJECTS = ['Did your billing info change?', 'Issue With Your Gift Subscription To The Atlantic', 'So they can keep enjoying unlimited access, please act now',
  'Your gift subscription will be cancelled soon', 'Action Required - Your gift subscription payment has failed', 'Your Atlantic gift subscription is ending'];

const DAY_MS = 864e5;
const at = (d) => new Date(DemoKit.iso(d) + 'T00:00:00Z');

/* --- 4. Derive: everything dated comes from the clock ------------------------ */
function derive(s, today) {
  const t = DemoKit.iso(today);
  const day = diff(FAILED_ON, t);
  const paid = s.sub.status === 'active';
  const ended = !paid && t >= CANCEL_ON;
  const daysLeft = diff(t, CANCEL_ON);
  const gift = s.gift;
  const days = gift ? GIFT_DAYS : STD_DAYS, subjects = gift ? GIFT_SUBJECTS : STD_SUBJECTS;
  let emailNo = 0;
  days.forEach((d, i) => { if (d <= day) emailNo = i + 1; });
  emailNo = Math.max(1, emailNo);
  const emailSentOn = DemoKit.iso(new Date(at(FAILED_ON).getTime() + days[emailNo - 1] * DAY_MS));
  const o = s.old;
  const oldLabel = o.type === 'paypal' ? 'PayPal' : `${o.brand} ending ${o.last4}`;
  const reason = o.reason === 'expired' ? `your ${oldLabel} has expired` : o.reason === 'insufficient_funds' ? `your bank declined the ${oldLabel}` : 'your PayPal billing agreement was canceled';
  const short = gift
    ? `We couldn’t renew ${gift.first}’s gift because ${reason}.`
    : `We couldn’t renew your subscription because ${reason}.`;
  const until = daysLeft <= 7
    ? `<strong>${gift ? `${gift.first}’s access ends` : 'Your access ends'} ${F(CANCEL_ON)}, in ${daysLeft} ${daysLeft === 1 ? 'day' : 'days'}.</strong>`
    : `${gift ? `${gift.first}’s access continues` : 'Your access continues'} until ${F(CANCEL_ON)}.`;
  const methodText = (m) => m ? (m.type === 'card' ? `${m.brand} ending ${m.last4}` : `${WALLETS[m.type].label} (${m.card})`) : oldLabel;
  return { short, until, day, paid, ended, daysLeft, emailNo, emailSentOn, subject: subjects[emailNo - 1], oldLabel, methodText,
    status: paid ? 'active' : ended ? 'cancelled' : 'past_due',
    headline: gift ? `So ${gift.first} can keep enjoying The Atlantic` : 'Don’t miss a story' };
}

/* Mock card fields: formatting and brand detection only */
function cardForm(el) {
  // Visual only: no validation and no Stripe. Typing is optional; "Renew" always goes through.
  // Show a decline with Demo → "Next save fails".
  const f = el.querySelector('#card');
  const cc = f.querySelector('#cc'), exp = f.querySelector('#exp'), cvc = f.querySelector('#cvc');
  const digits = (v) => v.replace(/\D/g, '');
  const brandOf = (n) => /^3[47]/.test(n) ? 'Amex' : /^5[1-5]|^2[2-7]/.test(n) ? 'Mastercard' : /^4/.test(n) ? 'Visa' : /^6/.test(n) ? 'Discover' : null;
  const badges = f.querySelector('.brands');
  cc.addEventListener('input', () => {
    const n = digits(cc.value).slice(0, 16);
    cc.value = n.replace(/(\d{4})(?=\d)/g, '$1 ');
    const b = brandOf(n);
    badges.classList.toggle('picked', !!b);
    badges.querySelectorAll('svg').forEach((c) => c.classList.toggle('on', c.dataset.b === b));
  });
  exp.addEventListener('input', () => { const n = digits(exp.value).slice(0, 4); exp.value = n.length > 2 ? n.slice(0, 2) + ' / ' + n.slice(2) : n; });
  cvc.addEventListener('input', () => { cvc.value = digits(cvc.value).slice(0, 4); });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const n = digits(cc.value);
    const method = { type: 'card', brand: (n.length >= 4 && brandOf(n)) || 'Visa', last4: n.length >= 4 ? n.slice(-4) : '4242' };
    const ok = await kit.run(() => kit.act('pay', method),
      'Your card was declined, and nothing was charged. Please try another card or payment method.',
      { label: 'pay by card', trigger: e.submitter });
    if (ok) kit.setParam('step', 'done', { push: true });
  });
}
/* Wallet sheets: drawn as the OS would show them; the confirm runs through the error arm */
function overlay(cls, html, center) {
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim' + (center ? ' center' : '');
  scrim.innerHTML = `<div class="sheet ${cls}" role="dialog" aria-modal="true" data-dk-scope>${html}</div>`;
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.addEventListener('click', (e) => { if (e.target === scrim || e.target.closest('[data-close]')) close(); });
  const onKey = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey);
  setTimeout(() => { const b = scrim.querySelector('.sheet-pay'); if (b) b.focus(); });
  return { scrim, close };
}
function walletSheet(w) {
  const W = WALLETS[w], amt = money(PRICE);
  const lines = `<div class="sheet-card">
      <div class="sheet-line"><span>Card</span><span>${W.card}</span></div>
      <div class="sheet-line"><span>Pay</span><span><b>The Atlantic</b> · ${amt}</span></div></div>`;
  const html = W.sheet === 'apple'
    ? `<div class="sheet-head"><span>${APPLE}Pay</span><button type="button" data-close>Cancel</button></div>${lines}
       <div class="actions"><button type="button" class="sheet-pay">Pay with Face ID</button></div><p class="sheet-note">Double-click the side button in real life.</p>`
    : W.sheet === 'paypal'
      ? `<div class="sheet-head"><span>${PAYPAL}</span><button type="button" data-close>✕</button></div>
         <p style="margin:0 0 12px">Hi, Jane</p>${lines.replace('<span>Card</span>', '<span>Account</span>')}
         <div class="actions"><button type="button" class="sheet-pay">Pay Now</button></div>`
    : W.sheet === 'gpay'
      ? `<div class="sheet-head"><span>${GLOGO} Pay</span><button type="button" data-close>✕</button></div>${lines}
         <div class="actions"><button type="button" class="sheet-pay">Continue</button></div>`
      : `<div class="sheet-head"><span>link</span><button type="button" data-close>✕</button></div>${lines}
         <div class="actions"><button type="button" class="sheet-pay">Pay ${amt}</button></div>`;
  const { scrim, close } = overlay(W.sheet === 'apple' ? '' : W.sheet, html, W.sheet !== 'apple');
  scrim.querySelector('.sheet-pay').addEventListener('click', async (e) => {
    const ok = await kit.run(() => kit.act('pay', { type: w, card: W.card }),
      `${W.label} couldn’t complete the payment, so nothing was charged. Try again, or pay with a card.`,
      { label: 'pay with a wallet', trigger: e.currentTarget, delay: 900 });
    if (ok) { close(); kit.setParam('step', 'done', { push: true }); }
  });
}

      <p class="af-body">For further assistance, please contact our <a href="#/help">Customer Care team</a>.</p>
      <a class="af-btn thick block" href="#/login?${qs({ step: 'email' })}">Back to Sign In</a>`;
    stage = kit.next({ text: 'In real life the subscriber now leaves this page, finds a second email from The Atlantic, and taps its link. It signs them in and goes on to Subscription.',
      links: [{ label: 'Open the sign-in link >', to: '#/subscription?' + qs(), session: 'in' }] });
  } else if (step === 'reset') {
    html = `<a class="af-back" href="#/login?${qs({ step: 'email' })}">← Back</a><h1 class="af-title">Reset your password</h1>
      <p class="af-body">Enter the email address you use for your account, and we’ll send you a link to create a new password.</p>
      <form data-next="sent">${emailField(false)}<div class="af-gap"></div><button class="af-btn thick block" type="submit">Next</button></form>`;
  } else {
    html = `<h1 class="af-title">Enter your email to sign in or create an account</h1>
      <form data-next="password">${emailField(false)}<div class="af-gap"></div><button class="af-btn thick block" type="submit">Continue</button></form>${alt}`;
  }
  el.innerHTML = shell(`<div class="af-login">${html}</div>`, stage, { left: '', right: '', footSignIn: false });
  el.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => go(b.dataset.step)));
  const show = el.querySelector('[data-show]');
  if (show) show.addEventListener('click', () => { const pw = el.querySelector('#pw'); const on = pw.type === 'password'; pw.type = on ? 'text' : 'password'; show.textContent = on ? 'Hide' : 'Show'; });
  const f = el.querySelector('form[data-next]');
  if (f) f.addEventListener('submit', (e) => {
    e.preventDefault();
    if (f.dataset.next === 'in') kit.navigate('#/subscription?' + qs(), { session: 'in', push: true });   // AuthRedirect → ?redirect=
    else go(f.dataset.next);
  });
}

/* /subscription: AccountsApp + PageLayout + Subscription route, signed in */
let justSaved = false;
function subscriptionPage(el, { state: s, derived: d }) {
  if (syncControls()) return;
  if (s.session !== 'in') { later(() => kit.navigate('#/login?' + qs({ step: 'email' }), { push: false })); return; }   // AccountsApp: signed out → /login/?redirect=
  const g = s.gift, m = s.sub.method;
  const adding = kit.param('form') === 'add';
  const navRail = `<nav class="af-nav" aria-label="Account"><ul>
      <li><a href="#/help">Account</a></li>
      <li><a href="#/subscription?${qs()}" aria-current="page">Subscription</a>
        <ul>${d.ended || g ? '' : '<li><a href="#/help">Manage Subscription</a></li>'}<li><a href="#/help">Gift Subscriptions</a></li></ul></li>
      <li><a href="#/help">Saved Stories</a></li><li><a href="#/help">Newsletters</a></li>
      <li><a href="#/help">Library</a><ul><li><a href="#/help">Audio Articles</a></li></ul></li>
      <li><a href="#/help">Help</a></li></ul></nav>`;
  // Subscription Details. Assumes the subscription still reports "active" during dunning (the app only knows active, trialing, expired, canceled).
  const lastIssue = at(RENEWS_NEXT).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const short = (x) => DemoKit.fmt(x);
  const details = d.ended
    ? `<div class="af-card"><div class="af-int"><h2 class="af-title">Restart your subscription today.</h2>
        <a class="af-btn af-action" href="#/restart">Explore Options</a><div style="height:24px"></div></div></div>`
    : g
      ? `<div class="af-card"><div class="af-int"><h2 class="af-title">Become an Atlantic subscriber today.</h2>
          <a class="af-btn af-action" href="#/restart">Explore Options</a><div style="height:24px"></div></div></div>`
      : `<div class="af-card"><div class="af-int"><h2 class="af-title">Subscription Details</h2>
          <p class="af-desc">As a Digital subscriber, you enjoy:</p>
          <ul class="af-benefits">${['Unlimited access on any device', `12 magazine issues in PDF<em>&nbsp;(your last issue will be ${lastIssue})</em>`, '<em>The Atlantic</em>&nbsp;app for iOS and Android',
            'Narrated stories and podcasts', 'A digital archive, from 1857 to today', 'Gift articles to share with other readers', 'Subscriber events and discounts'].map((b) => `<li>${CHECK}<span>${b}</span></li>`).join('')}</ul>
          <a class="af-btn af-action" href="#/help">Manage</a></div>
        <div class="af-int"><dl class="af-fields"><div class="af-field"><dt>Subscription Period</dt><dd>${short(FAILED_ON)}—${short(RENEWS_NEXT)}</dd></div>
          <div class="af-field"><dt>Renewal Rate</dt><dd>${money(PRICE)}/year</dd></div></dl></div></div>`;
  // Billing Information, or the add-card form in its place
  const card = m && m.type === 'card' ? m : null;
  const shownBrand = card ? card.brand : s.old.brand, shownLast4 = card ? card.last4 : s.old.last4;
  const shownExp = card ? (card.exp || '12/2029') : '09/2026';
  const billing = d.ended ? '' : adding
    ? `<div class="af-card"><div class="af-int"><h2 class="af-title">Add a New Payment Method</h2>
        <form id="af-add" class="af-scope" novalidate>
          <div class="spe"><div class="spe-grid">
            <div class="spe-f full has-brands"><label for="s-cc">Card number</label><input class="spe-in" id="s-cc" inputmode="numeric" autocomplete="cc-number" placeholder="1234 1234 1234 1234"><span class="brands">${BRANDS}</span></div>
            <div class="spe-f"><label for="s-exp">Expiration date</label><input class="spe-in" id="s-exp" inputmode="numeric" placeholder="MM / YY"></div>
            <div class="spe-f"><label for="s-cvc">Security code</label><input class="spe-in" id="s-cvc" inputmode="numeric" placeholder="CVC"></div>
            <div class="spe-f"><label for="s-country">Country</label><select class="spe-in" id="s-country"><option>United States</option><option>Canada</option><option>United Kingdom</option></select></div>
            <div class="spe-f"><label for="s-zip">ZIP code</label><input class="spe-in" id="s-zip" inputmode="numeric" placeholder="12345"></div>
          </div><p class="spe-legal">By providing your card information, you allow The Atlantic Monthly Group LLC to charge your card for future payments in accordance with their terms.</p></div>
          <div class="af-btnrow actions"><button class="af-btn" type="submit">Save${justSaved ? `<span class="af-saved">✓ Saved</span>` : ''}</button><button class="af-btn-ter" type="button" data-cancel>Cancel</button></div>
        </form></div></div>`
    : `<div class="af-card"><div class="af-int">
        <div class="af-billhead"><h2 class="af-title">Billing Information</h2><button class="af-btn af-btn-sec" type="button" data-add><span aria-hidden="true">+ </span>Add a New Payment Method</button></div>
        <dl class="af-fields thirds">
          <div class="af-field"><dt>Payment Method</dt><dd>${brandLogo(shownBrand)}Ending in ${esc(shownLast4)}</dd></div>
          <div class="af-field"><dt>Card Expiration</dt><dd>${shownExp}</dd></div>
          <div class="af-field"><dt>Next Billing Date</dt><dd>${short(d.paid ? RENEWS_NEXT : FAILED_ON)}</dd></div></dl></div></div>`;
  const addr = (title, lines) => `<div class="af-card"><div class="af-int"><h3>${title}</h3><button class="af-btn-ter af-ter-pos" type="button">Edit</button>
      <div class="af-gray">${lines.map(esc).join('<br>')}</div></div></div>`;
  const addresses = `<div class="af-addr">${addr('Mailing Address', [s.subscriber.name, '1200 Pine St, Apt 4B', 'Portland, OR 97205'])}${addr('Billing Address', ['1200 Pine St', 'Apt 4B', 'Portland, OR 97205'])}</div>`;
  const stage = d.paid && !adding
    ? kit.next({ text: `That’s the end of today’s flow. Saving the card also charged the overdue ${money(PRICE)} renewal, but nothing on the page says so. The only signs are the new card and the next billing date.`,
        links: [{ label: 'Back to the email >', to: '#/email?' + qs() }] })
    : !d.paid && !d.ended && !adding
      ? kit.note((g ? 'Gift giver view is inferred: Jane has no subscription of her own, so the page offers her one, and Billing Information appears because she has gifts. ' : '') + 'Nothing on this page says the renewal failed. The accounts site has no past-due, expired-card or failed-charge banner, and the “Don’t Lose Your Access” banner is switched off for everyone. Next Billing Date showing the failed date is inferred; the API value during dunning isn’t verified.')
      : '';
  el.innerHTML = shell(`<div class="af-page">${navRail}<main class="af-main"><button class="af-navbtn" type="button">Subscription <span aria-hidden="true">⌄</span></button>${details}${billing}${addresses}</main></div>`,
    stage ? `<div class="af-stage">${stage}</div>` : '', { right: 'out', flush: true });
  const add = el.querySelector('[data-add]');
  if (add) add.addEventListener('click', () => kit.setParam('form', 'add', { push: true }));
  const cancel = el.querySelector('[data-cancel]');
  if (cancel) cancel.addEventListener('click', () => kit.setParam('form', null, { push: true }));
  const f = el.querySelector('#af-add');
  if (f) {
    const cc = f.querySelector('#s-cc'), exp = f.querySelector('#s-exp');
    const digits = (v) => v.replace(/\D/g, '');
    const brandOf = (n) => /^3[47]/.test(n) ? 'Amex' : /^5[1-5]|^2[2-7]/.test(n) ? 'Mastercard' : /^4/.test(n) ? 'Visa' : /^6/.test(n) ? 'Discover' : null;
    const badges = f.querySelector('.brands');
    cc.addEventListener('input', () => { const n = digits(cc.value).slice(0, 16); cc.value = n.replace(/(\d{4})(?=\d)/g, '$1 '); const b = brandOf(n);
      badges.classList.toggle('picked', !!b); badges.querySelectorAll('svg').forEach((c) => c.classList.toggle('on', c.dataset.b === b)); });
    exp.addEventListener('input', () => { const n = digits(exp.value).slice(0, 4); exp.value = n.length > 2 ? n.slice(0, 2) + ' / ' + n.slice(2) : n; });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const n = digits(cc.value), x = digits(exp.value);
      const method = { type: 'card', brand: (n.length >= 4 && brandOf(n)) || 'Visa', last4: n.length >= 4 ? n.slice(-4) : '4242', exp: x.length === 4 ? `${x.slice(0, 2)}/20${x.slice(2)}` : '12/2029' };
      // Stripe's own decline message, shown in red under the buttons
      const ok = await kit.run(() => { justSaved = true; return kit.act('pay', method); }, 'Your card was declined.', { label: 'save a new card', trigger: e.submitter });
      if (ok) setTimeout(() => { justSaved = false; kit.setParam('form', null, { push: true }); }, 750);
    });
  }
}

const stubPage = (title, body, links) => () => shell(`<div class="col-utility"><div class="box">
  <h1 class="util-title">${title}</h1><p class="util-body">${body}</p>
  ${links ? `<p class="util-body">${links}</p>` : ''}<span class="stub-tag">Not built in this prototype</span></div></div>`);
const pages = [
  { path: '/email', title: 'Dunning email', area: 'public', render: emailPage,
    purpose: 'Start here. The email for today’s dunning day; one button opens the update page.',
    sideCardIntro: 'Set up the demo here. Experience switches between today’s email and flow and the proposed one.', preconditions: PRE_EMAIL },
  { path: '/update', title: 'Fix your payment', area: 'public', render: updatePage,
    purpose: 'The sign-in-free page on the accounts shell. Two layouts from the side card: All methods (stacked wallets, “OR USE”, the Card panel) or Card only (one utility card). Also its spent and ended states.',
    sideCardIntro: 'Set up the demo here. Payment page switches the layout; switching Subscription resets the demo data.', preconditions: PRE },
  { path: '/restart', title: 'Restart (reactivation)', area: 'public',
    purpose: 'Where an ended subscription goes. The reactivation flow is its own prototype.',
    render: stubPage('Resubscribe', 'This is where the reactivation flow takes over: one-page checkout with the expired-card repair and “You’re back.”',
      '') },
  { path: '/login', title: 'Sign in (today)', area: 'public', render: loginPage, preconditions: PRE_ACCT,
    purpose: 'Today’s sign-in, where the email’s button lands when signed out: email, then password, or a one-time email link.',
    sideCardIntro: 'Today’s sign-in, as the accounts site ships it.' },
  { path: '/subscription', title: 'Subscription (today)', area: 'public', render: subscriptionPage, preconditions: PRE_ACCT,
    purpose: 'Today’s signed-in Subscription page: Subscription Details, Billing Information and the card-only “Add a New Payment Method” form. Signed out, it sends you to sign in.',
    sideCardIntro: 'Today’s Subscription page, as the accounts site ships it.' },
  { path: '/cancel', title: 'Cancel', area: 'public', purpose: 'The quiet way out. Today’s cancel flow, unchanged.',
    render: stubPage('Cancel your subscription', 'The existing cancel flow. Offered as a plain link so nobody feels trapped on a payment page.') },
  { path: '/help', title: 'Help Center', area: 'public', purpose: 'Where “We’re happy to help” goes.',
    render: stubPage('Help Center', 'support.theatlantic.com, where Customer Care answers billing questions.') },
  { path: '/reading', title: 'Back to reading', area: 'public', purpose: 'Where “Continue reading” lands.',
    render: stubPage('Back to The Atlantic', 'theatlantic.com, where they were before the email.') },
];

const nav = [];

/* --- 8. Init ------------------------------------------------------------------ */
const kit = DemoKit.init({
  key: 'proto-dunning-update-v5',
  today: TODAY,
  home: '/email',
  project: { name: 'Fix your payment', description: 'Today’s dunning flow (email, sign-in, Subscription page, card form) beside the proposed sign-in-free page' },
  company: 'The Atlantic',
  contact: { name: 'Atlantic customer care', email: 'help@theatlantic.com' },
  footer: HELP,
  brand: 'The Atlantic',
  scenarios, axes, pages, paths, nav, derive, actions,
  saves: ['pay with a wallet', 'pay by card', 'save a new card'],
  validate: (s) => s && s.sub && typeof s.sub.status === 'string' && s.old && s.subscriber,
  fonts: 'atlantic-accounts',
  mode: new URLSearchParams(location.search).has('sketch') ? 'sketch' : 'build',
});
</script>
