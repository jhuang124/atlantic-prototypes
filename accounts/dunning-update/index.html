<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix your payment</title>
<link rel="stylesheet" href="./demo-kit.css">
<style>
/* ==========================================================================
   Product layer for the dunning update page. Anatomy follows the accounts site
   (Figma Trials 18118:287311 payment, 18118:287325 confirmation, 9346:283968
   add payment method): header Home · wordmark · Sign in, warm paper page, white
   0-radius cards, filled graphite primary, stacked black wallets, "OR USE".
   ========================================================================== */
:root { --primary: #2C2825; --primary-hover: #000; }
.public .stage.has-side { display: block; max-width: none; }
.public .stage.has-side > .demo-sidecard { position: fixed; top: 120px; right: 20px; width: 272px; z-index: 40; max-height: calc(100vh - 140px); overflow: auto; }
@media (max-width: 1239px) { .public .stage.has-side > .demo-sidecard { position: static; width: auto; max-width: 560px; margin: 152px auto 0; max-height: none; } }  /* 104 offsets .acct's bottom pull */

/* Shell: the whole accounts page, edge to edge. Phone = the same page at 375. */
.acct { margin: -64px calc(50% - 50vw) -104px; background: var(--page); }
.acct.is-phone { background: #E9E7E2; padding: 32px 0 0; }
.vp { container-type: inline-size; background: var(--page); min-height: 100vh; display: flex; flex-direction: column; }
.is-phone .vp { width: 375px; max-width: 100%; margin: 0 auto; border: 1px solid var(--hairline); border-bottom: 0; }
.acct-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 66px; padding: 0 32px;
  background: var(--surface); border-top: 4px solid #000; border-bottom: 1px solid var(--hairline); }
.acct-header a { font: 600 14px/16px var(--font-sans); color: #000; text-decoration: none; }
.acct-header .right { justify-self: end; }
.acct-header .wm { display: block; height: 30px; width: auto; }
.acct-body { flex: 1; padding: 40px 24px 104px; }
.col-checkout { max-width: 562px; margin: 0 auto; }
.col-utility { max-width: 520px; margin: 0 auto; }
.col-confirm { max-width: 594px; margin: 0 auto; }
.acct-body > .demo-box { max-width: 562px; margin: 48px auto 0; }

.acct-foot { position: relative; display: flex; justify-content: space-between; gap: 40px; padding: 48px 80px 56px;
  background: var(--page); border-top: 1px solid var(--hairline); }
.acct-foot nav { display: flex; flex-wrap: wrap; gap: 12px 32px; }
.acct-foot nav a { font: 14px/1.3 var(--font-sans); color: #000; text-decoration: none; }
.acct-foot .legal { display: flex; gap: 12px; margin-top: 28px; font: 12px/1.3 var(--font-sans); }
.acct-foot .legal a { color: #000; text-decoration: none; }
.acct-foot .legal span { width: 1px; background: var(--stone); }
.acct-foot .captcha { margin-top: 12px; font: 12px/1.5 var(--font-sans); color: #000; }
.foot-mark { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: none; }
.foot-mark .glyph { font: 600 64px/1 var(--font-serif); color: var(--ink-soft); }
.foot-mark img { height: 22px; width: auto; }
.help-pill { position: absolute; right: 20px; bottom: 20px; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px;
  border-radius: 48px; background: #000; color: #fff; font: 600 15px/1 var(--font-sans); text-decoration: none; }

/* Type */
.pg-title { font: 40px/1.1 var(--font-serif); color: #000; }
.pg-dek { margin-top: 12px; font: 18px/1.45 var(--font-sans); color: var(--ink-soft); }
.sec-title { margin: 40px 0 16px; font: 28px/1.15 var(--font-serif); color: #000; }

/* Cards: white, 1px hairline, square corners */
.box { background: var(--surface); border: 1px solid var(--hairline); border-radius: 0; padding: 24px; }
.summary { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
.fld dt { font: 12px/16px var(--font-sans); color: var(--ink-soft); }
.fld dd { margin: 4px 0 0; font: 18px/1.35 var(--font-sans); color: #000; }

/* Wallets: full-width black, stacked (PayPal, Apple Pay, Google Pay) */
.wallets { display: grid; gap: 8px; }
.wallet { height: 44px; width: 100%; border: 0; border-radius: 4px; background: #000; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 4px; font: 500 20px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
.wallet:hover { background: #222; }
.wallet:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.wallet svg { width: 18px; height: 18px; }
.pp-w { font: italic 700 18px/1 Verdana, 'Helvetica Neue', sans-serif; letter-spacing: -.02em; color: #fff; }
.or-use { display: flex; align-items: center; gap: 12px; margin: 20px 0; font: 12px/1 var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: #000; }
.or-use::before, .or-use::after { content: ''; flex: 1; border-top: 1px solid var(--stone); }

/* Card form: labeled fields (Arial 16 in 52px fields), brand badges, Stripe consent line */
.card-panel { padding: 20px 16px; }
.card-panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font: 500 14px/1 var(--font-sans); color: #000; }
.pay-fields { display: grid; gap: 16px; }
.pay-fields .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pay-field { display: flex; flex-direction: column; gap: 8px; position: relative; }
.pay-field label { font: 500 12px/16px var(--font-sans); color: var(--ink-soft); }
.pay-input { height: 52px; width: 100%; padding: 0 16px; border: 1px solid var(--stone); border-radius: 4px; background: var(--surface); color: var(--ink); font: 16px/1.3 Arial, sans-serif; }
.pay-input::placeholder { color: var(--stone); }
.pay-input:focus { outline: 2px solid var(--link); outline-offset: 0; }
.has-brands .pay-input { padding-right: 124px; }
.brands { position: absolute; right: 12px; bottom: 18px; display: flex; gap: 4px; pointer-events: none; }
.brands svg { display: block; transition: opacity .15s; }
.brands.picked svg:not(.on) { opacity: .25; }
.consent { margin-top: 16px; font: 14px/1.4 var(--font-sans); color: var(--stone); }
.pay-submit { margin-top: 24px; }
.pay-submit .btn { width: 100%; }
.after-note { margin-top: 20px; font: 14px/1.5 var(--font-sans); color: var(--stone); text-align: center; }
.after-note a { color: var(--stone); }

/* Card-only page (recipe: one centered utility card) */
.util-title { font: 30px/1.15 var(--font-serif); color: #000; }
.util-body { margin-top: 12px; font: 16px/1.5 var(--font-sans); color: var(--ink-soft); }
.util-card form { margin-top: 24px; }
.util-meta { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--hairline); font: 14px/1.5 var(--font-sans); color: var(--stone); }

/* Confirmation (ConfirmationTemplate) */
.cf-title { font: 40px/1.2 var(--font-serif); color: #000; }
.cf-body { margin-top: 16px; font: 16px/1.5 var(--font-sans); color: var(--ink-soft); }
.cf-rule { margin: 32px 0; border: 0; border-top: 1px solid var(--stone); opacity: .5; }
.cf-sum { margin: 0; }
.cf-sum h2 { font: 28px/1.15 var(--font-serif); color: #000; margin-bottom: 20px; }
.cf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 0; }
.cf-grid dt { font: 500 12px/1.3 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: #000; }
.cf-grid dd { margin: 6px 0 0; font: 21px/1.3 var(--font-serif); color: var(--ink-soft); overflow-wrap: anywhere; }
.cf-care { font: 21px/1.45 var(--font-serif); color: var(--ink-soft); }
.cf-care a { color: inherit; }
.cf-actions { margin-top: 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px; }

/* Stub pages */
.stub-tag { display: inline-block; margin-top: 20px; }

/* Narrow: same page at phone width (container query, so the Phone view and a real phone agree) */
@container (max-width: 600px) {
  .acct-header { padding: 0 16px; }
  .acct-header .wm { height: 22px; }
  .acct-body { padding: 24px 0 72px; }
  .col-checkout > :not(.box):not(form), .col-confirm, .col-utility > :not(.box) { padding-left: 16px; padding-right: 16px; }
  .col-checkout form > :not(.box) { margin-left: 16px; margin-right: 16px; }
  .col-checkout .box, .col-utility .box { border-left: 0; border-right: 0; }
  .pg-title, .cf-title { font-size: 32px; }
  .pg-dek { font-size: 16px; }
  .summary, .cf-grid { grid-template-columns: 1fr; }
  .acct-foot { flex-direction: column-reverse; align-items: flex-start; gap: 28px; padding: 32px 16px 80px; }
  .acct-foot nav { flex-direction: column; gap: 14px; }
  .acct-body > .demo-box { margin: 40px 16px 0; }
}

/* Wallet sheets: system UI, not Atlantic. Drawn to read as the OS, not the product. */
.sheet-scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; z-index: 60; }
.sheet-scrim.center { align-items: center; }
.sheet { width: min(420px, 100%); background: #f2f2f7; border-radius: 14px 14px 0 0; padding: 14px 18px 26px; font: 15px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #000; }
.sheet.gpay { background: #fff; border-radius: 12px; padding: 22px 22px 18px; font-family: Roboto, 'Segoe UI', Arial, sans-serif; }
.sheet.paypal { background: #fff; border-radius: 12px; padding: 22px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 600; font-size: 17px; }
.sheet-head button { background: none; border: 0; color: #0a64d8; font: inherit; font-weight: 400; cursor: pointer; }
.sheet-card { background: #fff; border-radius: 10px; }
.sheet-line { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; }
.sheet-line + .sheet-line { border-top: .5px solid #d1d1d6; }
.sheet-line span:first-child { color: #6b6b70; }
.sheet-pay { margin-top: 16px; width: 100%; height: 50px; border: 0; border-radius: 10px; background: #000; color: #fff; font: 600 17px/1 inherit; cursor: pointer; }
.gpay .sheet-pay { background: #1a73e8; border-radius: 22px; height: 44px; font-size: 15px; }
.paypal .sheet-pay { background: #0070E0; border-radius: 22px; height: 44px; font-size: 15px; }
.sheet .alert { margin: 12px 0 0; }
.sheet-note { font-size: 12px; color: #6b6b70; text-align: center; margin: 10px 0 0; }
.pp { font: italic 700 19px/1 Verdana, 'Helvetica Neue', sans-serif; letter-spacing: -.02em; }
.pp b { color: #003087; font-weight: 700; } .pp i { color: #0070E0; }

/* Email (kit email frame, Atlantic template body) */
.wm-email { display: block; height: 20px; width: auto; margin: 0 0 28px; }
.benefits { margin: 0 0 8px; padding-left: 20px; } .benefits li { margin: 4px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="./demo-kit.js"></script>
<script>
/* ==========================================================================
   Dunning: fix your payment without signing in.
   A renewal charge failed. The dunning email's button opens a single-purpose
   page on accounts.theatlantic.com that charges the open invoice. Two layouts,
   switched from the side card: All methods (PayPal, Apple Pay, Google Pay, then
   a card) or Card only (one clean card, the hosted-update-page pattern).
   Visual only: nothing is charged and no payment provider is called.
   Order: constants → scenarios → axes → derive → actions → paths → pages → init.
   ========================================================================== */

/* --- 1. Constants ------------------------------------------------------------ */
const TODAY = '2026-10-20';           // the anchor: day 7 of dunning
const FAILED_ON = '2026-10-13';       // day 0: the renewal charge failed
const CANCEL_ON = '2026-11-12';       // day 30: the subscription is canceled
const RENEWS_NEXT = '2027-10-13';     // a year from the original renewal date
const PRICE = 89.99;
const HELP = 'Questions? Visit our Help Center or call (855) 940-0585.';
const STD_DAYS = [2, 5, 7, 15, 20, 25, 29];
const STD_SUBJECTS = ['Did your billing info change?', 'Issue With Your Subscription To The Atlantic', 'Don’t lose your access to The Atlantic',
  'Your subscription will be cancelled soon', 'Action Required - Your Atlantic subscription payment has failed', 'Your Atlantic subscription is ending',
  'Your subscription—and what it means to us'];
const GIFT_DAYS = [2, 5, 7, 15, 20, 25];
const GIFT_SUBJECTS = ['Did your billing info change?', 'Issue With Your Gift Subscription To The Atlantic', 'So they can keep enjoying unlimited access, please act now',
  'Your gift subscription will be cancelled soon', 'Action Required - Your gift subscription payment has failed', 'Your Atlantic gift subscription is ending'];

const DAY_MS = 864e5;
const at = (d) => new Date(DemoKit.iso(d) + 'T00:00:00Z');
const diff = (a, b) => Math.round((at(b) - at(a)) / DAY_MS);
// Dates as written, per the accounts voice rules: “November 12, 2026”
const F = (d, style) => style === 'short' ? DemoKit.fmt(d, 'short') : at(d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
const esc = DemoKit.esc;
const money = (n) => '$' + n.toFixed(2);
const APPLE = '<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true" style="margin-top:-3px"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>';
const GLOGO = '<svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
const PAYPAL = '<span class="pp"><b>Pay</b><i>Pal</i></span>';
const CARD_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1.5"/><path d="M2.5 9.5h19"/></svg>';
const CHAT_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg>';
// Card brand badges, drawn small like Stripe's. The one that matches the typed number stays lit.
const BRANDS = [
  ['Visa', '<rect width="30" height="20" rx="2" fill="#1A1F71"/><text x="15" y="13.5" text-anchor="middle" font-family="Arial" font-weight="700" font-style="italic" font-size="8.5" fill="#fff">VISA</text>'],
  ['Mastercard', '<rect width="30" height="20" rx="2" fill="#252525"/><circle cx="12" cy="10" r="5.5" fill="#EB001B"/><circle cx="18" cy="10" r="5.5" fill="#F79E1B" fill-opacity=".9"/>'],
  ['Amex', '<rect width="30" height="20" rx="2" fill="#2E77BC"/><text x="15" y="13" text-anchor="middle" font-family="Arial" font-weight="700" font-size="7" fill="#fff">AMEX</text>'],
  ['Discover', '<rect x=".5" y=".5" width="29" height="19" rx="2" fill="#fff" stroke="#D9D9D9"/><text x="12" y="12.5" text-anchor="middle" font-family="Arial" font-weight="700" font-size="5.5" fill="#231F20">DISCOVER</text><circle cx="25" cy="10" r="2.6" fill="#F48120"/>'],
].map(([b, inner]) => `<svg data-b="${b}" viewBox="0 0 30 20" width="30" height="20" aria-hidden="true">${inner}</svg>`).join('');
const WALLETS = {
  paypal: { label: 'PayPal', button: '<span class="pp-w">PayPal</span>', card: 'jane.m•••@example.com', sheet: 'paypal' },
  apple_pay: { label: 'Apple Pay', button: APPLE + '<span>Pay</span>', card: 'Visa •• 1881', sheet: 'apple' },
  google_pay: { label: 'Google Pay', button: GLOGO + '<span>Pay</span>', card: 'Mastercard •• 5100', sheet: 'gpay' },
};

/* --- 2. Scenarios: who failed, and why --------------------------------------- */
const JANE = { first: 'Jane', name: 'Jane Morrison', email: 'jane.morrison@example.com', masked: 'j•••@example.com', since: 2021 };
const base = (extra) => Object.assign({ subscriber: JANE, plan: 'Atlantic Digital, annual', gift: null,
  sub: { status: 'past_due', method: null, paidOn: null } }, extra);
const scenarios = [
  { id: 'subscriber', label: 'Subscriber', description: 'Jane’s Visa expired, so her $89.99 annual renewal failed. Access continues while she fixes it.',
    build: () => base({ old: { type: 'card', brand: 'Visa', last4: '3220', reason: 'expired', decline: 'hard' } }) },
  { id: 'gift', label: 'Gift giver', description: 'Same failure, but Jane pays for Sam Whitaker’s gift. Sam keeps reading and never sees the dunning.',
    build: () => base({ plan: 'Atlantic Digital gift, annual', gift: { name: 'Sam Whitaker', first: 'Sam' },
      old: { type: 'card', brand: 'Visa', last4: '3220', reason: 'expired', decline: 'hard' } }) },
];

/* --- 3. Axes: the dunning clock ---------------------------------------------- */
const axes = [
  { key: 'day', label: 'Dunning clock', default: 'd7', keptOnSwitch: true, options: [
    { value: 'd7', label: 'Before cancellation', description: 'October 20, day 7 of 30. The third email has gone out; access continues.' },
    { value: 'ended', label: 'After cancellation', today: '2026-11-13', description: 'November 13. The subscription was canceled on November 12, so the page hands off to Resubscribe.' },
  ] },
];

/* --- 4. Derive: everything dated comes from the clock ------------------------ */
function derive(s, today) {
  const t = DemoKit.iso(today);
  const day = diff(FAILED_ON, t);
  const paid = s.sub.status === 'active';
  const ended = !paid && t >= CANCEL_ON;
  const daysLeft = diff(t, CANCEL_ON);
  const gift = s.gift;
  const days = gift ? GIFT_DAYS : STD_DAYS, subjects = gift ? GIFT_SUBJECTS : STD_SUBJECTS;
  let emailNo = 0;
  days.forEach((d, i) => { if (d <= day) emailNo = i + 1; });
  emailNo = Math.max(1, emailNo);
  const emailSentOn = DemoKit.iso(new Date(at(FAILED_ON).getTime() + days[emailNo - 1] * DAY_MS));
  const o = s.old;
  const oldLabel = o.type === 'paypal' ? 'PayPal' : `${o.brand} ending ${o.last4}`;
  const reason = o.reason === 'expired' ? `your ${oldLabel} has expired` : o.reason === 'insufficient_funds' ? `your bank declined the ${oldLabel}` : 'your PayPal billing agreement was canceled';
  const short = gift
    ? `We couldn’t renew ${gift.first}’s gift because ${reason}.`
    : `We couldn’t renew your subscription because ${reason}.`;
  const until = daysLeft <= 7
    ? `<strong>${gift ? `${gift.first}’s access ends` : 'Your access ends'} ${F(CANCEL_ON)}, in ${daysLeft} ${daysLeft === 1 ? 'day' : 'days'}.</strong>`
    : `${gift ? `${gift.first}’s access continues` : 'Your access continues'} until ${F(CANCEL_ON)}.`;
  const methodText = (m) => m ? (m.type === 'card' ? `${m.brand} ending ${m.last4}` : `${WALLETS[m.type].label} (${m.card})`) : oldLabel;
  return { short, until, day, paid, ended, daysLeft, emailNo, emailSentOn, subject: subjects[emailNo - 1], oldLabel, methodText,
    status: paid ? 'active' : ended ? 'cancelled' : 'past_due',
    headline: gift ? `So ${gift.first} can keep enjoying The Atlantic` : 'Don’t miss a story' };
}

/* --- 5. Actions -------------------------------------------------------------- */
const actions = {
  pay: (s, method) => ({ ...s, sub: { status: 'active', method, paidOn: kit.days(0) } }),
};

/* --- 6. Paths ---------------------------------------------------------------- */
const paths = [
  { id: 'one-tap', label: 'From the email to paid, in one tap',
    summary: 'Subscriber on a phone, All methods page. Open the email, pay with Apple Pay, land on the confirmation.',
    start: { scenario: 'subscriber', session: 'out', axes: { day: 'd7' }, to: '#/email?device=iphone&layout=all' },
    steps: [
      'Email 3, the real template: “Don’t let your access expire. Please act now.” → “Update Your Payment”.',
      'The page at phone width, no sign-in: “Don’t miss a story”, then a card with the plan, $89.99 due, and “Access continues until November 12, 2026”.',
      '“Payment Information”: PayPal, Apple Pay and Google Pay stacked full width; “OR USE”; the Card panel and “Renew for $89.99”.',
      'Apple Pay → the sheet: The Atlantic, $89.99, Visa •• 1881 → “Pay with Face ID”.',
      'Confirmation: “Thank you, Jane.” and the Order Summary, paid with Apple Pay, next billing date October 13, 2027.',
      'Next in the demo → “Open the email again” → “Update Your Payment”: “You’re all set”, because the link is spent.',
    ] },
  { id: 'card', label: 'Paying by card, with a decline',
    summary: 'Subscriber on desktop, All methods page. The error switch shows a decline, and the retry goes through.',
    start: { scenario: 'subscriber', session: 'out', axes: { day: 'd7' }, to: '#/update?device=desktop&layout=all' },
    steps: [
      'Desktop: the accounts header (Home · The Atlantic · Sign in), “Don’t miss a story” and the summary card. The card fields are for show; no typing needed.',
      'Demo → “Next save fails” on, then “Renew for $89.99”.',
      'Red alert above the button: “Your card was declined, and nothing was charged.”',
      '“Renew for $89.99” again → “Thank you, Jane.”, paid with Visa ending 4242.',
    ] },
  { id: 'card-only', label: 'The card-only page',
    summary: 'The hosted-update-page pattern (Churn Buster and most recovery vendors): one clean card with the card form and nothing else. Compare it with the full page from the side card.',

function syncControls() {

/* Mock card fields: formatting and brand detection only */
function cardForm(el) {
  // Visual only: no validation and no Stripe. Typing is optional; "Renew" always goes through.
  // Show a decline with Demo → "Next save fails".
  const f = el.querySelector('#card');
  const cc = f.querySelector('#cc'), exp = f.querySelector('#exp'), cvc = f.querySelector('#cvc');
  const digits = (v) => v.replace(/\D/g, '');
  const brandOf = (n) => /^3[47]/.test(n) ? 'Amex' : /^5[1-5]|^2[2-7]/.test(n) ? 'Mastercard' : /^4/.test(n) ? 'Visa' : /^6/.test(n) ? 'Discover' : null;
  const badges = f.querySelector('.brands');
  cc.addEventListener('input', () => {
    const n = digits(cc.value).slice(0, 16);
    cc.value = n.replace(/(\d{4})(?=\d)/g, '$1 ');
    const b = brandOf(n);
    badges.classList.toggle('picked', !!b);
    badges.querySelectorAll('svg').forEach((c) => c.classList.toggle('on', c.dataset.b === b));
  });
  exp.addEventListener('input', () => { const n = digits(exp.value).slice(0, 4); exp.value = n.length > 2 ? n.slice(0, 2) + ' / ' + n.slice(2) : n; });
  cvc.addEventListener('input', () => { cvc.value = digits(cvc.value).slice(0, 4); });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const n = digits(cc.value);
    const method = { type: 'card', brand: (n.length >= 4 && brandOf(n)) || 'Visa', last4: n.length >= 4 ? n.slice(-4) : '4242' };
    const ok = await kit.run(() => kit.act('pay', method),
      'Your card was declined, and nothing was charged. Please try another card or payment method.',
      { label: 'pay by card', trigger: e.submitter });
    if (ok) kit.setParam('step', 'done', { push: true });
  });
}
/* Wallet sheets: drawn as the OS would show them; the confirm runs through the error arm */
function overlay(cls, html, center) {
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim' + (center ? ' center' : '');
  scrim.innerHTML = `<div class="sheet ${cls}" role="dialog" aria-modal="true" data-dk-scope>${html}</div>`;
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.addEventListener('click', (e) => { if (e.target === scrim || e.target.closest('[data-close]')) close(); });
  const onKey = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey);
  setTimeout(() => { const b = scrim.querySelector('.sheet-pay'); if (b) b.focus(); });
  return { scrim, close };
}
function walletSheet(w) {
  const W = WALLETS[w], amt = money(PRICE);
  const lines = `<div class="sheet-card">
      <div class="sheet-line"><span>Card</span><span>${W.card}</span></div>
      <div class="sheet-line"><span>Pay</span><span><b>The Atlantic</b> · ${amt}</span></div></div>`;
  const html = W.sheet === 'apple'
    ? `<div class="sheet-head"><span>${APPLE}Pay</span><button type="button" data-close>Cancel</button></div>${lines}
       <div class="actions"><button type="button" class="sheet-pay">Pay with Face ID</button></div><p class="sheet-note">Double-click the side button in real life.</p>`
    : W.sheet === 'paypal'
      ? `<div class="sheet-head"><span>${PAYPAL}</span><button type="button" data-close>✕</button></div>
         <p style="margin:0 0 12px">Hi, Jane</p>${lines.replace('<span>Card</span>', '<span>Account</span>')}
         <div class="actions"><button type="button" class="sheet-pay">Pay Now</button></div>`
    : W.sheet === 'gpay'
      ? `<div class="sheet-head"><span>${GLOGO} Pay</span><button type="button" data-close>✕</button></div>${lines}
         <div class="actions"><button type="button" class="sheet-pay">Continue</button></div>`
      : `<div class="sheet-head"><span>link</span><button type="button" data-close>✕</button></div>${lines}
         <div class="actions"><button type="button" class="sheet-pay">Pay ${amt}</button></div>`;
  const { scrim, close } = overlay(W.sheet === 'apple' ? '' : W.sheet, html, W.sheet !== 'apple');
  scrim.querySelector('.sheet-pay').addEventListener('click', async (e) => {
    const ok = await kit.run(() => kit.act('pay', { type: w, card: W.card }),
      `${W.label} couldn’t complete the payment, so nothing was charged. Try again, or pay with a card.`,
      { label: 'pay with a wallet', trigger: e.currentTarget, delay: 900 });
    if (ok) { close(); kit.setParam('step', 'done', { push: true }); }
  });
}
