<body>
<div id="app"></div>
<script src="./demo-kit.js"></script>
<script>
/* ==========================================================================
   Dunning: fix your payment without signing in (Option A, wallet-first).
   A renewal charge failed. The dunning email's button opens a single-purpose
   page that charges the open invoice with any available method: Apple Pay,
   Google Pay, PayPal or a card, no matter what failed. Visual only: nothing
   is charged and no payment provider is called.
   Order: constants → scenarios → axes → derive → actions → paths → pages → init.
   ========================================================================== */

/* --- 1. Constants ------------------------------------------------------------ */
const TODAY = '2026-10-20';           // the anchor: day 7 of dunning
const FAILED_ON = '2026-10-13';       // day 0: the renewal charge failed
const CANCEL_ON = '2026-11-12';       // day 30: the subscription is canceled
const RENEWS_NEXT = '2027-10-13';     // a year from the original renewal date
const PRICE = 89.99;
const HELP = 'Questions? Visit our Help Center or call (855) 940-0585.';
const STD_DAYS = [2, 5, 7, 15, 20, 25, 29];
const STD_SUBJECTS = ['Did your billing info change?', 'Issue With Your Subscription To The Atlantic', 'Don’t lose your access to The Atlantic',
  'Your subscription will be cancelled soon', 'Action Required - Your Atlantic subscription payment has failed', 'Your Atlantic subscription is ending',
  'Your subscription—and what it means to us'];
const GIFT_DAYS = [2, 5, 7, 15, 20, 25];
const GIFT_SUBJECTS = ['Did your billing info change?', 'Issue With Your Gift Subscription To The Atlantic', 'So they can keep enjoying unlimited access, please act now',
  'Your gift subscription will be cancelled soon', 'Action Required - Your gift subscription payment has failed', 'Your Atlantic gift subscription is ending'];

const DAY_MS = 864e5;
const at = (d) => new Date(DemoKit.iso(d) + 'T00:00:00Z');
const diff = (a, b) => Math.round((at(b) - at(a)) / DAY_MS);
// Dates as written, per the accounts voice rules: “November 12, 2026”
const F = (d, style) => style === 'short' ? DemoKit.fmt(d, 'short') : at(d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
const esc = DemoKit.esc;
const money = (n) => '$' + n.toFixed(2);

const APPLE = '<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true" style="margin-top:-3px"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>';

const GLOGO = '<svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
const PAYPAL = '<span class="pp"><b>Pay</b><i>Pal</i></span>';
// Views: a phone frame or a desktop page. All three wallets show in both, for the demo.
const DEVICES = { iphone: { frame: true }, android: { frame: true }, desktop: { frame: false } };
const CARD_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 9.5h19M6 15h4"/></svg>';
const METHODS = [
  { id: 'card', mark: CARD_ICON + '<span>Card</span>' },
  { id: 'apple_pay', mark: '<span class="mk">' + APPLE + 'Pay</span>', note: 'You’ll confirm with Face ID or Touch ID, using the card saved on your device.' },
  { id: 'google_pay', mark: '<span class="mk">' + GLOGO + 'Pay</span>', note: 'You’ll confirm with a card saved to your Google account.' },
  { id: 'paypal', mark: '<span class="pp">PayPal</span>'.replace('PayPal', '<b>Pay</b><i>Pal</i>'), note: 'You’ll sign in to PayPal to approve the payment, then return here.' },
];
const WALLETS = {
  apple_pay: { label: 'Apple Pay', button: APPLE + '<span>Pay</span>', card: 'Visa •• 1881', sheet: 'apple' },
  google_pay: { label: 'Google Pay', button: GLOGO + '<span>Pay</span>', card: 'Mastercard •• 5100', sheet: 'gpay' },
  paypal: { label: 'PayPal', button: PAYPAL, card: 'jane.m•••@example.com', sheet: 'paypal' },
};

const ISSUE = [
  { title: 'Choose Your Overlord: Musk or Bezos?', by: 'Josh Tyrangiel', dek: 'The billionaires’ race to build—and control—a new off-world economy.' },
  { title: 'The Babies Left Behind in America', by: 'Caitlin Dickerson', dek: 'Deporting parents without their children is creating a new family-separation crisis.' },
  { title: 'When Anesthesia Goes Wrong', by: 'Sarah Zhang', dek: 'A mother’s quest to understand what anesthesia did to her son.' },
  { title: 'The Baltic States Prepare for War', by: '', dek: 'How the most vulnerable NATO members are preparing for a Russian attack.' },
];

/* --- 2. Scenarios: who failed, and why --------------------------------------- */
const JANE = { first: 'Jane', name: 'Jane Morrison', email: 'jane.morrison@example.com', masked: 'j•••@example.com', since: 2021 };
const base = (extra) => Object.assign({ subscriber: JANE, plan: 'Atlantic Digital, annual', gift: null,
  sub: { status: 'past_due', method: null, paidOn: null } }, extra);
const scenarios = [
  { id: 'subscriber', label: 'Subscriber', description: 'Jane’s Visa expired, so her $89.99 annual renewal failed. Access continues while she fixes it.',
    build: () => base({ old: { type: 'card', brand: 'Visa', last4: '3220', reason: 'expired', decline: 'hard' } }) },
  { id: 'gift', label: 'Gift giver', description: 'Same failure, but Jane pays for Sam Whitaker’s gift. Sam keeps reading and never sees the dunning.',
    build: () => base({ plan: 'Atlantic Digital gift, annual', gift: { name: 'Sam Whitaker', first: 'Sam' },
      old: { type: 'card', brand: 'Visa', last4: '3220', reason: 'expired', decline: 'hard' } }) },
];

/* --- 3. Axes: the dunning clock ---------------------------------------------- */
const axes = [
  { key: 'day', label: 'Dunning clock', default: 'd7', keptOnSwitch: true, options: [
    { value: 'd7', label: 'Before cancellation', description: 'October 20, day 7 of 30. The third email has gone out; access continues.' },
    { value: 'ended', label: 'After cancellation', today: '2026-11-13', description: 'November 13. The subscription was canceled on November 12, so the page hands off to Resubscribe.' },
  ] },
];

/* --- 4. Derive: everything dated comes from the clock ------------------------ */
function derive(s, today) {
  const t = DemoKit.iso(today);
  const day = diff(FAILED_ON, t);
  const paid = s.sub.status === 'active';
  const ended = !paid && t >= CANCEL_ON;
  const daysLeft = diff(t, CANCEL_ON);
  const gift = s.gift;
  const days = gift ? GIFT_DAYS : STD_DAYS, subjects = gift ? GIFT_SUBJECTS : STD_SUBJECTS;
  let emailNo = 0;
  days.forEach((d, i) => { if (d <= day) emailNo = i + 1; });
  emailNo = Math.max(1, emailNo);
  const emailSentOn = DemoKit.iso(new Date(at(FAILED_ON).getTime() + days[emailNo - 1] * DAY_MS));
  const o = s.old;
  const oldLabel = o.type === 'paypal' ? 'PayPal' : `${o.brand} ending ${o.last4}`;
  const why = o.reason === 'expired' ? `The ${oldLabel} expired in September, so we couldn’t charge your ${money(PRICE)} renewal on ${F(FAILED_ON, 'short')}.`
    : o.reason === 'insufficient_funds' ? `Your bank declined the ${money(PRICE)} renewal on the ${oldLabel} on ${F(FAILED_ON, 'short')}.`
    : `Your PayPal account stopped allowing payments to The Atlantic, so we couldn’t charge your ${money(PRICE)} renewal on ${F(FAILED_ON, 'short')}.`;
  const giftWhy = gift && (o.reason === 'expired' ? `The ${oldLabel} expired in September, so we couldn’t renew the gift you give ${gift.name} on ${F(FAILED_ON, 'short')}.`
    : o.reason === 'insufficient_funds' ? `Your bank declined the ${money(PRICE)} renewal of the gift you give ${gift.name}.`
    : `Your PayPal account stopped allowing payments, so we couldn’t renew the gift you give ${gift.name}.`);
  const reason = o.reason === 'expired' ? `your ${oldLabel} has expired` : o.reason === 'insufficient_funds' ? `your bank declined the ${oldLabel}` : 'your PayPal billing agreement was canceled';
  const who = gift ? `${gift.first}` : 'You';
  const when = daysLeft <= 7
    ? `<strong>${gift ? `${gift.first}’s access ends` : 'Your access ends'} ${F(CANCEL_ON)}, in ${daysLeft} ${daysLeft === 1 ? 'day' : 'days'}.</strong>`
    : `${gift ? `${gift.first} keeps reading` : 'You’ll keep reading'} until ${F(CANCEL_ON, 'short')}.`;
  const short = gift
    ? `We couldn’t renew ${gift.first}’s gift because ${reason}.`
    : `We couldn’t renew your subscription because ${reason}.`;
  const until = daysLeft <= 7
    ? `<strong>${gift ? `${gift.first}’s access ends` : 'Your access ends'} ${F(CANCEL_ON)}, in ${daysLeft} ${daysLeft === 1 ? 'day' : 'days'}.</strong>`
    : `${gift ? `${gift.first}’s access continues` : 'Your access continues'} until ${F(CANCEL_ON)}.`;
  const reader = gift ? `${gift.first} keeps reading` : 'Your access continues';
  const deadline = daysLeft <= 7
    ? `<strong>${gift ? `${gift.first}’s access ends` : 'Your access ends'} ${F(CANCEL_ON)}, in ${daysLeft} ${daysLeft === 1 ? 'day' : 'days'}.</strong>`
    : `${reader} until <strong>${F(CANCEL_ON, 'short')}</strong>.`;
  const anyMethod = o.type === 'paypal' ? ' It doesn’t have to be PayPal.' : '';
  const methodText = (m) => m ? (m.type === 'card' ? `${m.brand} ending ${m.last4}` : `${WALLETS[m.type].label} (${m.card})`) : oldLabel;
  return { short, until, giftWhy, day, paid, ended, daysLeft, emailNo, emailSentOn, subject: subjects[emailNo - 1], oldLabel, why, deadline, anyMethod, methodText,
    status: paid ? 'active' : ended ? 'cancelled' : 'past_due',
    headline: gift ? `So ${gift.first} can keep enjoying The Atlantic` : 'Don’t miss a story' };
}

/* Mock Payment Element: Stripe’s own field messages, Stripe’s test cards */
function cardForm(el) {
  // Visual only: no validation and no Stripe. Typing is optional; "Renew" always goes through.
  // Show a decline with Demo → "Next save fails".
  const f = el.querySelector('#card');
  const cc = f.querySelector('#cc'), exp = f.querySelector('#exp'), cvc = f.querySelector('#cvc'), zip = f.querySelector('#zip');
  const digits = (v) => v.replace(/\D/g, '');
  const brandOf = (n) => /^3[47]/.test(n) ? 'Amex' : /^5[1-5]|^2[2-7]/.test(n) ? 'Mastercard' : /^4/.test(n) ? 'Visa' : null;
  cc.addEventListener('input', () => {
    const n = digits(cc.value).slice(0, 16);
    cc.value = n.replace(/(\d{4})(?=\d)/g, '$1 ');
    const b = brandOf(n);
    el.querySelectorAll('.brand-chip').forEach((c) => c.classList.toggle('on', c.dataset.b === b));
  });
  exp.addEventListener('input', () => { const n = digits(exp.value).slice(0, 4); exp.value = n.length > 2 ? n.slice(0, 2) + ' / ' + n.slice(2) : n; });
  [cvc, zip].forEach((i) => i.addEventListener('input', () => { i.value = digits(i.value).slice(0, i === zip ? 5 : 4); }));
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const n = digits(cc.value);
    const method = { type: 'card', brand: (n.length >= 4 && brandOf(n)) || 'Visa', last4: n.length >= 4 ? n.slice(-4) : '4242' };
    const ok = await kit.run(() => kit.act('pay', method),
      'Your card was declined, and nothing was charged. Please try another card or payment method.',
      { label: 'pay by card', trigger: e.submitter });
    if (ok) kit.setParam('step', 'done', { push: true });
  });
}

function overlay(cls, html, center) {
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim' + (center ? ' center' : '');
  scrim.innerHTML = `<div class="sheet ${cls}" role="dialog" aria-modal="true" data-dk-scope>${html}</div>`;
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.addEventListener('click', (e) => { if (e.target === scrim || e.target.closest('[data-close]')) close(); });
  const onKey = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey);
  setTimeout(() => { const b = scrim.querySelector('.sheet-pay'); if (b) b.focus(); });
  return { scrim, close };
}

         <p style="margin:0 0 12px">Hi, Jane</p>${lines.replace('<span>Card</span>', '<span>Account</span>')}
         <div class="actions"><button type="button" class="sheet-pay">Pay Now</button></div>`
    : W.sheet === 'gpay'
      ? `<div class="sheet-head"><span>${GLOGO} Pay</span><button type="button" data-close>✕</button></div>${lines}
         <div class="actions"><button type="button" class="sheet-pay">Continue</button></div>`
      : `<div class="sheet-head"><span>link</span><button type="button" data-close>✕</button></div>${lines}
         <div class="actions"><button type="button" class="sheet-pay">Pay ${amt}</button></div>`;
  const { scrim, close } = overlay(W.sheet === 'apple' ? '' : W.sheet, html, W.sheet !== 'apple');
  scrim.querySelector('.sheet-pay').addEventListener('click', async (e) => {
    const ok = await kit.run(() => kit.act('pay', { type: w, card: W.card }),
      `${W.label} couldn’t complete the payment, so nothing was charged. Try again, or pay with a card.`,
      { label: 'pay with a wallet', trigger: e.currentTarget, delay: 900 });
    if (ok) { close(); kit.setParam('step', 'done', { push: true }); }
  });
}
function bankCheck(method) {
  const { scrim, close } = overlay('bank', `<div class="sheet-head"><span>Verify it’s you</span><button type="button" data-close>✕</button></div>
    <p style="margin:0 0 6px">Your bank wants to confirm this ${money(PRICE)} payment to The Atlantic.</p>
    <p class="sheet-note" style="text-align:left">Stripe’s 3D Secure test page. In real life this is the bank’s screen or app.</p>
    <div class="actions"><button type="button" class="sheet-pay">Complete authentication</button></div>`, true);
  scrim.querySelector('.sheet-pay').addEventListener('click', async (e) => {
    const ok = await kit.run(() => kit.act('pay', method), 'Your bank didn’t confirm the payment, so nothing was charged. Try again, or use another card.',
      { label: 'bank check', trigger: e.currentTarget });
    if (ok) { close(); kit.setParam('step', 'done', { push: true }); }
  });
}

/* Signed-in account (app): the same facts from the other side */
function accountPage(el, { state: s, derived: d }) {
  const m = s.sub.method;
  const banner = d.paid
    ? `<div class="banner banner-success" style="margin-bottom:32px"><strong>Payment updated on ${F(s.sub.paidOn)}.</strong> Thanks for staying with us.</div>`
    : d.ended
      ? `<div class="banner banner-red" style="margin-bottom:32px"><strong>Your subscription ended on ${F(CANCEL_ON)}.</strong> We couldn’t collect the ${money(PRICE)} renewal. <a class="link" href="#/restart">Restart &gt;</a></div>`
      : `<div class="banner banner-red" style="margin-bottom:32px"><strong>We’re having trouble processing payment to renew your ${s.gift ? 'gift ' : ''}subscription.</strong> ${s.gift ? `${esc(s.gift.first)}’s access continues` : 'Your access continues'} until ${F(CANCEL_ON)}. <a class="link" href="#/update?${keep()}" data-dk-session="out">Update Your Payment &gt;</a></div>`;
  el.innerHTML = `<div class="page-head"><h1 class="t-heading">Subscription</h1><p class="dek">${esc(s.subscriber.name)} · ${esc(s.subscriber.email)}</p></div>
    ${banner}
    <table class="kv"><tbody>
      <tr><th scope="row">Plan</th><td>${esc(s.plan)}${s.gift ? `<br><span class="muted">For ${esc(s.gift.name)}</span>` : ''}</td></tr>
      <tr><th scope="row">Status</th><td>${d.paid ? 'Active' : d.ended ? 'Cancelled' : 'Payment past due'}</td></tr>
      <tr><th scope="row">Payment method</th><td>${d.paid ? esc(d.methodText(m)) : `${esc(d.oldLabel)} <span class="muted">· ${s.old.reason === 'expired' ? 'expired' : 'declined'}</span>`}</td></tr>
      <tr><th scope="row">${d.paid ? 'Next billing date' : 'Amount due'}</th><td>${d.paid ? F(RENEWS_NEXT) : d.ended ? 'Nothing' : money(PRICE)}</td></tr>
      <tr><th scope="row">Auto-renew</th><td>${d.ended ? 'Off' : 'On'}</td></tr>
    </tbody></table>`;
}

const stubPage = (title, body, links) => () => `${publicBar()}<div class="page-head"><h1 class="t-heading">${title}</h1><p class="dek">${body}</p></div>
  ${links ? `<div class="quiet-links">${links}</div>` : ''}<p style="margin-top:20px"><span class="stub-tag">Not built in this prototype</span></p>`;


const pages = [
  { path: '/email', title: 'Dunning email', area: 'public', render: emailPage,
    purpose: 'Start here. The email for today’s dunning day; one button opens the update page.',
    sideCardIntro: 'Set up the demo here. The email and the page update to match.', preconditions: PRE },
  { path: '/update', title: 'Fix your payment', area: 'public', render: updatePage,
    purpose: 'The sign-in-free page, laid out like checkout: an express row of wallets, then the card form. Also its expired, spent and ended states.',
    sideCardIntro: 'Set up the demo here. Switching Subscription resets the demo data.', preconditions: PRE },
  { path: '/restart', title: 'Restart (reactivation)', area: 'public',
    purpose: 'Where an ended subscription goes. The reactivation flow is its own prototype.',
    render: stubPage('Resubscribe', 'This is where the reactivation flow takes over: one-page checkout with the expired-card repair and “You’re back.”',
      '') },
  { path: '/signin', title: 'Sign in', area: 'public', purpose: 'The existing sign-in, for anyone who’d rather use their account.',
    render: stubPage('Sign in', 'The existing accounts.theatlantic.com sign-in. After it, Subscription shows the same past-due banner.',
      '<a class="link" href="#/account" data-dk-session="in">Skip to the signed-in page &gt;</a>') },
  { path: '/cancel', title: 'Cancel', area: 'public', purpose: 'The quiet way out. Today’s cancel flow, unchanged.',
    render: stubPage('Cancel your subscription', 'The existing cancel flow. Offered as a plain link so nobody feels trapped on a payment page.') },
  { path: '/help', title: 'Help Center', area: 'public', purpose: 'Where “We’re happy to help” goes.',
    render: stubPage('Help Center', 'support.theatlantic.com, where Customer Care answers billing questions.') },
  { path: '/reading', title: 'Back to reading', area: 'public', purpose: 'Where “Continue reading” lands.',
    render: stubPage('Back to The Atlantic', 'theatlantic.com, where they were before the email.') },
  { path: '/account', title: 'Subscription', area: 'app', render: accountPage,
    purpose: 'The signed-in Subscription page, showing the same facts: past due, then paid.' },
];

const nav = [
  { path: '/account', label: 'Subscription' },
  { path: '/newsletters', label: 'Newsletters', stub: 'Newsletters aren’t part of this prototype.' },
  { path: '/settings', label: 'Account settings', stub: 'Account settings aren’t part of this prototype.' },
];

/* --- 8. Init ------------------------------------------------------------------ */
const kit = DemoKit.init({
  key: 'proto-dunning-update-v3',
  today: TODAY,
  home: '/email',
  project: { name: 'Fix your payment', description: 'Dunning emails link to a sign-in-free page that takes Apple Pay, Google Pay, PayPal or a card, whatever failed before' },
  company: 'The Atlantic',

  scenarios, axes, pages, paths, nav, derive, actions,

});
</script>
